@media (max-height:520px){h1{font-size:30px!important}.sub{display:none}.lbl{margin-top:3px;font-size:12px}.chip{padding:5px 11px;font-size:13px}.btn{padding:8px 16px;font-size:15px}.help{display:none}#lbRoom{font-size:26px!important}#menu .row{margin:3px 0}input{padding:5px 8px}}
#tJump{width:56px;height:56px;right:calc(28px + env(safe-area-inset-right));bottom:40px}
#tCrouch{width:50px;height:50px;right:calc(104px + env(safe-area-inset-right));bottom:14px;font-size:13px}
#tMG{width:64px;height:64px;right:calc(130px + env(safe-area-inset-right));bottom:220px;background:rgba(160,110,20,.55)}
#mgTip{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);text-align:center;font-size:14px;text-shadow:0 1px 3px #000}
#tView{width:46px;height:46px;right:calc(200px + env(safe-area-inset-right));bottom:132px;font-size:12px}
#tBoard{width:40px;height:40px;left:50%;margin-left:28px;top:8px;font-size:13px}
</style>
</head>

function ctex(s,draw){const c=document.createElement('canvas');c.width=c.height=s;draw(c.getContext('2d'),s);const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;return t}
const TX_GLOW=ctex(64,(g,s)=>{const r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);r.addColorStop(0,'rgba(255,255,240,1)');r.addColorStop(.2,'rgba(255,215,140,.95)');r.addColorStop(.55,'rgba(255,130,30,.35)');r.addColorStop(1,'rgba(255,90,0,0)');g.fillStyle=r;g.fillRect(0,0,s,s)});
const TX_SMOKE=ctex(128,(g,s)=>{for(let i=0;i<14;i++){const x=rand(.3,.7)*s,y=rand(.3,.7)*s,rr=rand(.18,.34)*s;const r=g.createRadialGradient(x,y,0,x,y,rr);r.addColorStop(0,'rgba(18,18,20,.55)');r.addColorStop(1,'rgba(18,18,20,0)');g.fillStyle=r;g.fillRect(0,0,s,s)}});
const TX_BLOOD=ctex(128,(g,s)=>{g.fillStyle='rgba(70,4,2,.9)';for(let i=0;i<22;i++){g.beginPath();const a=Math.random()*6.28,d=Math.random()*s*.32;g.arc(s/2+Math.cos(a)*d,s/2+Math.sin(a)*d,rand(3,s*.16),0,7);g.fill()}});
const TX_DOT=ctex(32,(g,s)=>{const r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,s,s)});

const GL=new T.GLTFLoader(),TL=new T.TextureLoader();
let ldN=0,ldD=0;function ldTick(){ldD++;$('loadfill').style.width=(100*ldD/Math.max(1,ldN))+'%';$('loadT').textContent='正在载入素材 '+ldD+' / '+ldN}
// 用最简单的 fetch(网址) 取文件，再自行解析——兼容 Claude App 文件预览等受限环境
async function getBuf(url){let last;for(let i=0;i<3;i++){try{const r=await fetch(url,{mode:'cors'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.arrayBuffer()}catch(e){last=e;await new Promise(r=>setTimeout(r,400*(i+1)))}}
 return await new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open('GET',url);x.responseType='arraybuffer';x.onload=()=>x.status<400?res(x.response):rej(last||new Error('HTTP '+x.status));x.onerror=()=>rej(last||new Error('网络错误'));x.send()})}
const FAILS=[];
function loadGLB(p){ldN++;return getBuf(BASE+p).then(b=>new Promise((res,rej)=>GL.parse(b,'',res,rej))).then(g=>{ldTick();return g}).catch(e=>{console.warn('载入失败',p,e);FAILS.push(p);ldTick();return null})}
function loadTex(p){ldN++;return getBuf(BASE+p).then(b=>{const blob=new Blob([b],{type:'image/webp'});const u=URL.createObjectURL(blob);return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=u})}).then(im=>{const t=new T.Texture(im);t.needsUpdate=true;t.encoding=T.sRGBEncoding;t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=TOUCH?2:8;ldTick();return t}).catch(e=>{console.warn('载入失败',p,e);FAILS.push(p);ldTick();return null})}

async function loadAll(){
 const jobs=[];
 jobs.push(loadGLB('mx/anims.glb').then(g=>{ANIMS=g?g.animations:[]}));
 const mx=new Set(HUMANS.map(h=>h.id));for(const k in ZT)ZT[k].m.forEach(m=>mx.add(m));
 for(const n of mx)jobs.push(loadGLB('mx/'+n+'.glb').then(g=>{if(g)prepMX(g,n)}));

const REST=1.0613;
function prepMX(g,n){const rm=[];g.scene.traverse(o=>{if(o.isMesh&&/BattleAxe|Weapons_Geo/i.test(o.name))rm.push(o)});rm.forEach(o=>o.parent&&o.parent.remove(o));
 g.scene.updateMatrixWorld(true);const b=new T.Box3().setFromObject(g.scene);g.h=Math.max(.5,b.max.y-b.min.y);g.hipsY=REST;
 g.scene.traverse(o=>{if(o.isBone&&/Hips$/.test(o.name)&&g.hipsY===REST)g.hipsY=o.position.y});g.clips=null;MODELS[n]=g}
function clipsFor(g){if(g.clips)return g.clips;const C={},k=g.hipsY/REST;
 for(const c of ANIMS||[]){const cl=c.clone();for(const t of cl.tracks)if(/Hips\.position$/.test(t.name)){t.values=t.values.slice();for(let i=0;i<t.values.length;i++)t.values[i]*=k}C[c.name]=cl}
 return g.clips=C}

const LOOPS=['idle','walk','run','idle_gun','walk_gun','run_gun','crawl','crouch'],ONES=['death','hitreact','punch','idle_attack','scream','standup','jump','climb'];
function makeChar(name,prefix,height,tint){
 const g=MODELS[name];const root=T.SkeletonUtils.clone(g.scene);const wrap=new T.Group();wrap.add(root);
 root.scale.multiplyScalar(height/g.h);
 const bones={},mats=[];
 root.traverse(o=>{if(o.isMesh||o.isSkinnedMesh){o.castShadow=true;o.receiveShadow=false;o.frustumCulled=false;
   const ms=(Array.isArray(o.material)?o.material:[o.material]).map(m=>{const c=m.clone();if('roughness' in c){c.roughness=Math.max(c.roughness??.8,.6);c.metalness=Math.min(c.metalness??0,.2)}if(tint)c.color&&c.color.multiplyScalar(tint);mats.push(c);return c});o.material=Array.isArray(o.material)?ms:ms[0]}
  if(o.isBone)bones[o.name.toLowerCase().replace(/[^a-z0-9_]/g,'')]=o});
 const mixer=new T.AnimationMixer(root),act={},C=clipsFor(g);
 for(const k in C){if(!k.startsWith(prefix))continue;const nm=k.slice(2);const a=mixer.clipAction(C[k]);act[nm]=a;a.setEffectiveWeight(0)}
 for(const k of ONES)if(act[k]){act[k].setLoop(T.LoopOnce);act[k].clampWhenFinished=true}
 for(const k of LOOPS)if(act[k]){act[k].play();act[k].setEffectiveWeight(0)}
 const base=act.idle_gun?'idle_gun':'idle';if(act[base])act[base].setEffectiveWeight(1);
 const blob=new T.Mesh(new T.CircleGeometry(height*.24,16),new T.MeshBasicMaterial({map:TX_DOT,color:0,transparent:true,opacity:.5,depthWrite:false}));blob.rotation.x=-Math.PI/2;blob.position.y=.02;wrap.add(blob);
 return {wrap,root,mixer,act,bones,mats,base,ts:1,one:null,w:{},flash:0,h:height,s:height/1.8}}
function setBase(c,n,ts){if(!c.act[n])n=c.act.idle?'idle':n;c.base=n;c.ts=ts==null?1:ts}
function playOnce(c,n,ts=1){const a=c.act[n];if(!a)return 0;a.reset();a.timeScale=ts;a.setEffectiveWeight(1);a.play();c.one={n,t:a.getClip().duration/ts};return c.one.t}
function updChar(c,dt){const k=Math.min(1,dt*10);
 for(const n of LOOPS){const a=c.act[n];if(!a)continue;let tw=(!c.one&&c.base===n)?1:0;const cw=c.w[n]||0;const nw=cw+(tw-cw)*k;c.w[n]=nw;a.setEffectiveWeight(nw);if(c.base===n)a.timeScale=c.ts}
 if(c.one){c.one.t-=dt;if(c.one.t<=0&&c.one.n!=='death'){const a=c.act[c.one.n];a.setEffectiveWeight(0);a.stop();c.one=null}}
 if(c.flash>0){c.flash-=dt;const on=c.flash>0;if(c.fl!==on){c.fl=on;for(const m of c.mats)m.emissive&&m.emissive.setHex(on?0x7a0c04:0)}}
 c.mixer.update(dt)}

function placeProp(n,x,z,ry,len,collide){const src=PROPS[n];if(!src)return null;const o=src.clone(true);

 const g=new T.Group();g.add(o);o.position.set(-(b.min.x+b.max.x)/2*k,-b.min.y*k,-(b.min.z+b.max.z)/2*k);g.position.set(x,0,z);g.rotation.y=ry;scene.add(g);

function hostStart(){if(!NET.host)return;const o=NET.opt;const teams={};const L=NET.list.length?NET.list:[myPres()];const cnt=[0,0];
 for(const p of L.slice(0,MAXP)){let t=o.mode==='pvp'?(p.team|0):0;if(o.mode==='pvp'&&cnt[t]>=TEAM_MAX)t=1-t;cnt[t]++;teams[p.id]=t}
 const cfg={mid:'m'+Date.now().toString(36),mode:o.mode,diff:o.diff,ai:o.ai,teams};NET.started=true;G.mid=cfg.mid;nsend('start',cfg);beginMatch(cfg)}
$('bSolo').onclick=startSolo;
$('bCreate').onclick=()=>{audioInit();enterRoom(roomCode(),true)};
$('bJoin').onclick=()=>{const c=($('code').value||'').trim().toUpperCase();if(c.length<4){menuMsg('请输入房间号');return}audioInit();enterRoom(c,false)};
$('bLbStart').onclick=()=>{audioInit();fullscreen();hostStart()};
$('bLeave').onclick=toMenu;
$('bTeam').onclick=()=>{NET.team=1-(NET.team|0);if(NET.tr)NET.tr.track(myPres());lobbyRender()};
$('bCopy').onclick=()=>{const t=$('lbLink').textContent;try{navigator.clipboard.writeText(t).then(()=>lbMsg('邀请链接已复制'),()=>lbMsg('请长按下方链接复制'))}catch(e){lbMsg('请长按下方链接复制')}};

// ---------- 键鼠 ----------
const cv=$('c');function lock(){try{const r=cv.requestPointerLock();r&&r.catch&&r.catch(()=>{})}catch(e){}}
const IN={k:{},fire:false,fireHeld:false,joy:new T.Vector2(),aimHold:false};
cv.addEventListener('mousedown',e=>{if(TOUCH||G.state!=='play'||G.paused)return;if(document.pointerLockElement!==cv){lock();return}if(e.button===0){IN.fire=true;IN.fireHeld=false}if(e.button===2)IN.aimHold=true});
addEventListener('mouseup',e=>{if(e.button===0){IN.fire=false;IN.fireHeld=false}if(e.button===2)IN.aimHold=false});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('mousemove',e=>{if(document.pointerLockElement!==cv||G.state!=='play'||P.dead&&G.mode==='pvp')return;const s=.0022*(P.aimOn?.6:1);P.yaw-=e.movementX*s;P.pitch=clamp(P.pitch-e.movementY*s,-1.05,.75)});
addEventListener('wheel',e=>{if(G.state!=='play')return;const o=WP.map((_,i)=>i).filter(i=>G.ws[i].own);const k=o.indexOf(G.cur);equip(o[(k+(e.deltaY>0?1:-1)+o.length)%o.length])});
document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&G.state==='play'&&!G.shop&&!TOUCH)pause(true)});
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT'){if(e.key==='Enter'&&e.target.id==='code')$('bJoin').click();return}IN.k[e.code]=true;
 if(e.code==='Tab'){e.preventDefault();if(G.state==='play')showBoard(true)}
 if(G.state!=='play'||G.paused)return;
 if(e.code==='Space'){e.preventDefault();if(P.mg)dismount();else doJump()}
 if(e.code==='KeyC'||e.code==='ControlLeft')toggleCrouch();
 if(e.code==='KeyE'){if(P.mg)dismount();else mount(nearMG())}
 if(e.code==='KeyR')reload();if(e.code==='KeyV')setView(VIEW==='fp'?'tp':'fp');if(/^Digit[1-4]$/.test(e.code))equip(+e.code.slice(5)-1);if(e.code==='KeyQ')equip(G.last);
 if(e.code==='KeyB'&&G.mode==='z'){if(G.shop){closeShop();lock()}else openShop()}});
addEventListener('keyup',e=>{IN.k[e.code]=false;if(e.code==='Tab')showBoard(false)});
addEventListener('blur',()=>{IN.k={};IN.fire=false});

// ---------- 触屏 ----------
const TT={joy:null,look:null,fire:null};
function tBtn(id,down,up){const e=$(id);e.addEventListener('touchstart',ev=>{ev.preventDefault();ev.stopPropagation();audioInit();down(ev.changedTouches[0],e)},{passive:false});
 e.addEventListener('touchend',ev=>{ev.preventDefault();ev.stopPropagation();up&&up(ev.changedTouches[0],e)},{passive:false});e.addEventListener('touchcancel',ev=>{up&&up(ev.changedTouches[0],e)})}
const fireDown=(t,e)=>{IN.fire=true;TT.fire={id:t.identifier,x:t.clientX,y:t.clientY};e.classList.add('on')},fireUp=(t,e)=>{IN.fire=false;TT.fire=null;e.classList.remove('on')};
tBtn('tFire',fireDown,fireUp);tBtn('tFire2',fireDown,fireUp);
tBtn('tAim',(t,e)=>{P.aimT=!P.aimT;e.classList.toggle('on',P.aimT)});
tBtn('tRel',()=>reload());
tBtn('tSw',()=>{const o=WP.map((_,i)=>i).filter(i=>G.ws[i].own);equip(o[(o.indexOf(G.cur)+1)%o.length])});
tBtn('tPause',()=>pause(true));
tBtn('tJump',()=>{if(P.mg)dismount();else doJump()});tBtn('tCrouch',()=>toggleCrouch());tBtn('tMG',()=>{if(P.mg)dismount();else mount(nearMG())});
tBtn('tView',()=>setView(VIEW==='fp'?'tp':'fp'));
tBtn('tBoard',()=>showBoard($('board').classList.contains('hid')));
document.addEventListener('touchstart',e=>{if(G.state!=='play'||!TOUCH||G.paused)return;if(e.target.closest&&(e.target.closest('.tb')||e.target.closest('#shop')||e.target.closest('#board')))return;
 for(const t of e.changedTouches){if(t.clientX<innerWidth*.42&&!TT.joy){TT.joy={id:t.identifier,x:t.clientX,y:t.clientY};const b=$('joyB');b.style.display='block';b.style.left=(t.clientX-60)+'px';b.style.top=(t.clientY-60)+'px'}
  else if(!TT.look)TT.look={id:t.identifier,x:t.clientX,y:t.clientY}}},{passive:true});
document.addEventListener('touchmove',e=>{if(!TOUCH)return;if(G.state==='play')e.preventDefault();
 for(const t of e.changedTouches){if(TT.joy&&t.identifier===TT.joy.id){let dx=t.clientX-TT.joy.x,dy=t.clientY-TT.joy.y;const l=Math.hypot(dx,dy),m=55;if(l>m){dx*=m/l;dy*=m/l}IN.joy.set(dx/m,dy/m);$('joyK').style.transform=`translate(${dx}px,${dy}px)`}
  const L=(TT.look&&t.identifier===TT.look.id)?TT.look:(TT.fire&&t.identifier===TT.fire.id)?TT.fire:null;
  if(L&&G.state==='play'&&!G.paused){const s=.0058*(P.aimOn?.55:1);P.yaw-=(t.clientX-L.x)*s;P.pitch=clamp(P.pitch-(t.clientY-L.y)*s*.8,-1.05,.75);L.x=t.clientX;L.y=t.clientY}}},{passive:false});
function tEnd(e){for(const t of e.changedTouches){if(TT.joy&&t.identifier===TT.joy.id){TT.joy=null;IN.joy.set(0,0);$('joyB').style.display='none';$('joyK').style.transform=''}if(TT.look&&t.identifier===TT.look.id)TT.look=null}}
document.addEventListener('touchend',tEnd);document.addEventListener('touchcancel',tEnd);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!NET.on)pause(true)});

// ---------- 主循环 ----------
let menuZ=[];
function loop(){requestAnimationFrame(loop);let dt=clock.getDelta();dt=Math.min(dt,.05);
 if(G.state==='play'){if(!(G.paused&&!NET.on))update(dt);netTick(dt)}
 else if(G.state==='menu'||G.state==='lobby'){const t=performance.now()/1000;camera.position.set(Math.sin(t*.08)*22,7+Math.sin(t*.2),Math.cos(t*.08)*22);camera.lookAt(0,1.5,0);fxUpdate(dt);for(const c of menuZ)updChar(c,dt)}
 else if(G.state==='over'){updHumans(dt);for(const z of G.zs)updChar(z.c,dt);P.c&&updChar(P.c,dt);fxUpdate(dt)}
 renderer.render(scene,camera)}
(async()=>{try{await loadAll()}catch(e){console.error(e)}
 if(!ANIMS||!ANIMS.length||!HUMANS.some(h=>MODELS[h.id])){$('loadT').innerHTML='素材载入失败（'+FAILS.length+' 个文件）<br><span style="font-size:13px;opacity:.75">请检查网络，或用浏览器（Chrome）直接打开本页面</span><br><button class="btn" onclick="location.reload()" style="margin-top:12px">重新载入</button>';return}
 if(!MODELS[HUMANS[skinI].id])skinI=Math.max(0,HUMANS.findIndex(h=>MODELS[h.id]));
 buildMap();buildMGs();$('load').classList.add('hid');G.state='menu';
 for(let i=0;i<5;i++){const t=ZT.walker;const m=pick(t.m.filter(n=>MODELS[n]));if(!m)break;const c=makeChar(m,'z_',1.78,.9);c.wrap.position.set(rand(-8,8),0,rand(-8,8));c.wrap.rotation.y=rand(0,6);setBase(c,'idle',1);scene.add(c.wrap);menuZ.push(c)}
 setView(VIEW);$('pop').style.opacity=0;showMenu();
 const qr=new URLSearchParams(location.search).get('room');if(qr){$('code').value=qr.toUpperCase();menuMsg('已收到邀请：填好名字后点「加入房间」')}
 loop();window.__G=G;window.__P=P;window.__NET=NET;window.__HUM=HUM})();
</script>
