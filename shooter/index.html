<!DOCTYPE html>
<html lang="zh-CN">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0e10;color:#e8e2d6;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:20;background:radial-gradient(ellipse at center,rgba(30,20,16,.72),rgba(5,5,6,.94))}
.hid{display:none!important}
h1{font-size:clamp(34px,7vw,64px);letter-spacing:.12em;color:#e9d9b8;text-shadow:0 0 18px rgba(200,40,20,.55),0 3px 0 #3a0d08}

.btn{background:linear-gradient(#8b1d12,#5a0f08);border:1px solid #c4523c;color:#fbe9d8;padding:11px 28px;font-size:17px;border-radius:6px;cursor:pointer;letter-spacing:.15em;margin:5px;min-width:150px}
.btn:hover{filter:brightness(1.18)}
.btn.g{background:linear-gradient(#3a3b3e,#232427);border-color:#6a6b70}

.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0}

.lbl{font-size:13px;opacity:.65;margin-top:10px;letter-spacing:.15em}

#loadbar{width:min(360px,70vw);height:6px;background:#2a2522;border-radius:3px;overflow:hidden;margin-top:14px}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}

#hpf{background:linear-gradient(90deg,#9b1c12,#e3452c)}

#slots span.own{opacity:.85}#slots span.cur{opacity:1;border-color:#e0664c;background:rgba(140,30,18,.6)}
#xh{position:absolute;left:50%;top:50%;width:0;height:0}

#hm{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;opacity:0;transition:opacity .12s}
#hm:before,#hm:after{content:"";position:absolute;left:12px;top:0;width:2px;height:26px;background:#fff;transform:rotate(45deg)}
#hm:after{transform:rotate(-45deg)}
#hm.hs:before,#hm.hs:after{background:#ff4a2e}
#pop{position:absolute;left:50%;top:41%;transform:translateX(-50%);font-size:18px;font-weight:700;color:#ff6a48;text-shadow:0 0 6px #000;opacity:0;transition:opacity .3s}
#banner{position:absolute;left:0;right:0;top:22%;text-align:center;font-size:clamp(26px,5vw,46px);letter-spacing:.2em;color:#f2d3a8;text-shadow:0 0 16px rgba(220,40,20,.8),0 2px 0 #000;opacity:0;transition:opacity .5s}
#banner small{display:block;font-size:.42em;letter-spacing:.15em;opacity:.8;margin-top:6px}
#msg{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:15px;color:#ffd9a0;text-shadow:0 1px 3px #000}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(160,0,0,.75));opacity:0}
.dmg{position:absolute;opacity:0;transition:opacity .25s}
#dF{left:0;right:0;top:0;height:40%;background:radial-gradient(ellipse 45% 70% at 50% 0%,rgba(220,0,0,.6),transparent 100%)}
#dB{left:0;right:0;bottom:0;height:40%;background:radial-gradient(ellipse 45% 70% at 50% 100%,rgba(220,0,0,.6),transparent 100%)}
#dL{top:0;bottom:0;left:0;width:35%;background:radial-gradient(ellipse 70% 45% at 0% 50%,rgba(220,0,0,.6),transparent 100%)}
#dR{top:0;bottom:0;right:0;width:35%;background:radial-gradient(ellipse 70% 45% at 100% 50%,rgba(220,0,0,.6),transparent 100%)}
#rel{position:absolute;left:50%;top:58%;transform:translateX(-50%);font-size:14px;color:#fff;text-shadow:0 1px 3px #000}
#portrait{position:absolute;left:50%;top:70px;transform:translateX(-50%);font-size:12px;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:12px}
/* touch */
body.touch .br{right:auto;left:50%;transform:translateX(-50%);bottom:6px;text-align:center}
body.touch #ammo{font-size:24px}body.touch #ammo small{font-size:13px}body.touch #wname{font-size:12px}
body.touch #slots{justify-content:center}body.touch #slots span{font-size:10px;padding:1px 5px}
body.touch .bl{width:min(200px,26vw)}
#touch{position:fixed;inset:0;z-index:11;pointer-events:none}
.tb{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(20,20,22,.45);border:2px solid rgba(255,255,255,.28);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;text-shadow:0 1px 2px #000}
.tb.on{background:rgba(160,30,18,.6);border-color:#ff8a6a}
#tFire{width:84px;height:84px;right:calc(28px + env(safe-area-inset-right));bottom:120px;font-size:17px;background:rgba(140,26,16,.5)}
#tFire2{width:62px;height:62px;left:calc(26px + env(safe-area-inset-left));top:44%;background:rgba(140,26,16,.45)}
#tAim{width:58px;height:58px;right:calc(130px + env(safe-area-inset-right));bottom:150px}
#tRel{width:54px;height:54px;right:calc(120px + env(safe-area-inset-right));bottom:72px}
#tSw{width:54px;height:54px;right:calc(28px + env(safe-area-inset-right));bottom:220px;font-size:12px}
#tPause{width:40px;height:40px;left:50%;margin-left:-20px;top:8px;font-size:13px}
#tShop{width:58px;height:58px;right:calc(200px + env(safe-area-inset-right));bottom:60px;font-size:13px}
#joyB{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.2);display:none}
#joyK{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.35);left:34px;top:34px}
/* shop */
#shop{position:fixed;inset:0;z-index:25;background:rgba(6,6,8,.82);display:flex;align-items:center;justify-content:center}
#shopIn{width:min(860px,96vw);max-height:94vh;overflow:auto;background:#17161a;border:1px solid #4a3a30;border-radius:10px;padding:14px 16px}
#shopHd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap}
#shopHd h2{font-size:20px;letter-spacing:.15em;color:#f0c08a}
#shopCash{font-size:18px;color:#9fe08a}
#shopGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.card{background:#211f24;border:1px solid #3a3540;border-radius:8px;padding:10px}
.card h3{font-size:16px;margin-bottom:3px}
.card p{font-size:12px;opacity:.7;line-height:1.5;min-height:36px}
.card .btn{min-width:0;width:100%;padding:7px 6px;font-size:13px;margin:5px 0 0;letter-spacing:.05em}
#shopFt{display:flex;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap;gap:8px}
#shopT{font-size:15px;opacity:.85}
.stat{font-size:15px;line-height:2;text-align:center}
.stat b{color:#f0c08a}
</style>
</head>

<canvas id="c"></canvas>

<div id="hud" class="hid">

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/SkeletonUtils.js"></script>
<script>
'use strict';
const T=THREE,$=id=>document.getElementById(id);
const TOUCH=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window&&navigator.maxTouchPoints>0&&!matchMedia('(pointer:fine)').matches);
// 素材来源：放在 5dayz 仓库里时直接读 ../assets/，其它地方读 jsDelivr 上的 cdn 分支
const BASE=(()=>{try{const m=document.querySelector('meta[name=asset-base]');if(m&&m.content)return m.content;const h=location.hostname;if(/github\.io$/.test(h)||h==='localhost'||h==='127.0.0.1')return '../assets/'}catch(e){}return 'https://cdn.jsdelivr.net/gh/liewchoon710-pixel/5dayz@0614e26d28c75290e999d2d535d0b2b2e5b9f74e/'})();
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[Math.floor(Math.random()*a.length)];
let seed=7;const srand=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};

// ================= 渲染器 =================
const renderer=new T.WebGLRenderer({canvas:$('c'),antialias:!TOUCH,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,TOUCH?1.25:1.75));
renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();const FOGC=0x1b1c20;scene.background=new T.Color(FOGC);scene.fog=new T.FogExp2(FOGC,.026);
const camera=new T.PerspectiveCamera(65,1,.08,220);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();$('portrait').classList.toggle('hid',!(TOUCH&&h>w))}
addEventListener('resize',resize);resize();if(TOUCH)document.body.classList.add('touch');
scene.add(new T.HemisphereLight(0x8d99ab,0x2c2118,.62));
const sun=new T.DirectionalLight(0xffb489,1.35);sun.position.set(28,42,-18);sun.castShadow=true;
sun.shadow.mapSize.set(TOUCH?1024:2048,TOUCH?1024:2048);const sc=sun.shadow.camera;sc.left=-46;sc.right=46;sc.top=46;sc.bottom=-46;sc.near=1;sc.far=120;sun.shadow.bias=-.0006;sun.shadow.normalBias=.03;
scene.add(sun);scene.add(sun.target);
const amb=new T.AmbientLight(0x404048,.25);scene.add(amb);

// ================= 程序贴图 =================
function ctex(s,draw){const c=document.createElement('canvas');c.width=c.height=s;draw(c.getContext('2d'),s);const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;return t}
const TX_GLOW=ctex(64,(g,s)=>{const r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);r.addColorStop(0,'rgba(255,255,240,1)');r.addColorStop(.2,'rgba(255,215,140,.95)');r.addColorStop(.55,'rgba(255,130,30,.35)');r.addColorStop(1,'rgba(255,90,0,0)');g.fillStyle=r;g.fillRect(0,0,s,s)});
const TX_SMOKE=ctex(128,(g,s)=>{for(let i=0;i<14;i++){const x=rand(.3,.7)*s,y=rand(.3,.7)*s,rr=rand(.18,.34)*s;const r=g.createRadialGradient(x,y,0,x,y,rr);r.addColorStop(0,'rgba(18,18,20,.55)');r.addColorStop(1,'rgba(18,18,20,0)');g.fillStyle=r;g.fillRect(0,0,s,s)}});
const TX_BLOOD=ctex(128,(g,s)=>{g.fillStyle='rgba(70,4,2,.9)';for(let i=0;i<22;i++){g.beginPath();const a=Math.random()*6.28,d=Math.random()*s*.32;g.arc(s/2+Math.cos(a)*d,s/2+Math.sin(a)*d,rand(3,s*.16),0,7);g.fill()}});
const TX_DOT=ctex(32,(g,s)=>{const r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,s,s)});

// ================= 载入 =================
const GL=new T.GLTFLoader(),TL=new T.TextureLoader();
let ldN=0,ldD=0;function ldTick(){ldD++;$('loadfill').style.width=(100*ldD/Math.max(1,ldN))+'%';$('loadT').textContent='正在载入素材 '+ldD+' / '+ldN}
// 用最简单的 fetch(网址) 取文件，再自行解析——兼容 Claude App 文件预览等受限环境
async function getBuf(url){let last;for(let i=0;i<3;i++){try{const r=await fetch(url,{mode:'cors'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.arrayBuffer()}catch(e){last=e;await new Promise(r=>setTimeout(r,400*(i+1)))}}
 return await new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open('GET',url);x.responseType='arraybuffer';x.onload=()=>x.status<400?res(x.response):rej(last||new Error('HTTP '+x.status));x.onerror=()=>rej(last||new Error('网络错误'));x.send()})}
const FAILS=[];
function loadGLB(p){ldN++;return getBuf(BASE+p).then(b=>new Promise((res,rej)=>GL.parse(b,'',res,rej))).then(g=>{ldTick();return g}).catch(e=>{console.warn('载入失败',p,e);FAILS.push(p);ldTick();return null})}
function loadTex(p){ldN++;return getBuf(BASE+p).then(b=>{const blob=new Blob([b],{type:'image/webp'});const u=URL.createObjectURL(blob);return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=u})}).then(im=>{const t=new T.Texture(im);t.needsUpdate=true;t.encoding=T.sRGBEncoding;t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=TOUCH?2:8;ldTick();return t}).catch(e=>{console.warn('载入失败',p,e);FAILS.push(p);ldTick();return null})}
const HUMANS=[{id:'swat',n:'特警'},{id:'ch17nonpbr',n:'幸存者'},{id:'brute',n:'壮汉'},{id:'erikaarcher',n:'女猎手'}];
const ZT={
 walker:{m:['warzombiefpedroso','zombiestandup1','yakujignite','zombiegirlwkurniawan','ch30nonpbr','copzombielactisdato'],hp:100,spd:1.35,dmg:12,h:1.78,r:.38,cash:10,pts:100,name:'丧尸'},
 runner:{m:['parasitelstarkie','nightshadejfriedrich'],hp:70,spd:3.3,dmg:9,h:1.72,r:.36,cash:15,pts:150,name:'疾行尸'},
 brute:{m:['pumpkinhulklshaw','ch25nonpbr'],hp:480,spd:1.55,dmg:28,h:2.25,r:.55,cash:60,pts:500,name:'巨尸'},
 boss:{m:['skeletonzombiestandup'],hp:2600,spd:2.3,dmg:40,h:2.9,r:.75,cash:500,pts:3000,name:'尸王'}};
const MODELS={},PROPS={},TEX={};let ANIMS=null;
const PROP_LIST=['k_vehicle_pickup','k_vehicle_sports','k_vehicle_truck','k_vehicle_truck_armored','k_vehicle_pickup_armored','bus','container','k_trafficbarrier_1','k_trafficbarrier_2','k_plasticbarrier','k_pallet_broken','k_pallet','k_trashbag_1','k_trashbag_2','k_cinderblock','k_wheels_stack','k_pipes','vending','forklift'];
const TEX_LIST=['road','walk','fac_brick_a','fac_brick_b','fac_conc','fac_glass_a','fac_glass_b','shopfront','roof_a','rubble_a','metal_a','wall_conc'];
async function loadAll(){
 const jobs=[];
 jobs.push(loadGLB('mx/anims.glb').then(g=>{ANIMS=g?g.animations:[]}));
 const mx=new Set(HUMANS.map(h=>h.id));for(const k in ZT)ZT[k].m.forEach(m=>mx.add(m));
 for(const n of mx)jobs.push(loadGLB('mx/'+n+'.glb').then(g=>{if(g)prepMX(g,n)}));
 for(const n of PROP_LIST)jobs.push(loadGLB('props/'+n+'.glb').then(g=>{if(g)PROPS[n]=g.scene}));
 for(const n of TEX_LIST)jobs.push(loadTex('mx/env/'+n+'.webp').then(t=>{TEX[n]=t}));
 await Promise.all(jobs);
}
const REST=1.0613;
function prepMX(g,n){const rm=[];g.scene.traverse(o=>{if(o.isMesh&&/BattleAxe|Weapons_Geo/i.test(o.name))rm.push(o)});rm.forEach(o=>o.parent&&o.parent.remove(o));

function clipsFor(g){if(g.clips)return g.clips;const C={},k=g.hipsY/REST;
 for(const c of ANIMS||[]){const cl=c.clone();for(const t of cl.tracks)if(/Hips\.position$/.test(t.name)){t.values=t.values.slice();for(let i=0;i<t.values.length;i++)t.values[i]*=k}C[c.name]=cl}

const LOOPS=['idle','walk','run','idle_gun','walk_gun','run_gun','crawl'],ONES=['death','hitreact','punch','idle_attack','scream','standup','jump'];
function makeChar(name,prefix,height,tint){
 const g=MODELS[name];const root=T.SkeletonUtils.clone(g.scene);const wrap=new T.Group();wrap.add(root);
 root.scale.multiplyScalar(height/g.h);
 const bones={},mats=[];
 root.traverse(o=>{if(o.isMesh||o.isSkinnedMesh){o.castShadow=true;o.receiveShadow=false;o.frustumCulled=false;
   const ms=(Array.isArray(o.material)?o.material:[o.material]).map(m=>{const c=m.clone();if('roughness' in c){c.roughness=Math.max(c.roughness??.8,.6);c.metalness=Math.min(c.metalness??0,.2)}if(tint)c.color&&c.color.multiplyScalar(tint);mats.push(c);return c});o.material=Array.isArray(o.material)?ms:ms[0]}
  if(o.isBone)bones[o.name.toLowerCase().replace(/[^a-z0-9_]/g,'')]=o});
 const mixer=new T.AnimationMixer(root),act={},C=clipsFor(g);
 for(const k in C){if(!k.startsWith(prefix))continue;const nm=k.slice(2);const a=mixer.clipAction(C[k]);act[nm]=a;a.setEffectiveWeight(0)}
 for(const k of ONES)if(act[k]){act[k].setLoop(T.LoopOnce);act[k].clampWhenFinished=true}
 for(const k of LOOPS)if(act[k]){act[k].play();act[k].setEffectiveWeight(0)}
 const base=act.idle_gun?'idle_gun':'idle';if(act[base])act[base].setEffectiveWeight(1);
 const blob=new T.Mesh(new T.CircleGeometry(height*.24,16),new T.MeshBasicMaterial({map:TX_DOT,color:0,transparent:true,opacity:.5,depthWrite:false}));blob.rotation.x=-Math.PI/2;blob.position.y=.02;wrap.add(blob);

function playOnce(c,n,ts=1){const a=c.act[n];if(!a)return 0;a.reset();a.timeScale=ts;a.setEffectiveWeight(1);a.play();c.one={n,t:a.getClip().duration/ts};return c.one.t}
function updChar(c,dt){const k=Math.min(1,dt*10);
 for(const n of LOOPS){const a=c.act[n];if(!a)continue;let tw=(!c.one&&c.base===n)?1:0;const cw=c.w[n]||0;const nw=cw+(tw-cw)*k;c.w[n]=nw;a.setEffectiveWeight(nw);if(c.base===n)a.timeScale=c.ts}
 if(c.one){c.one.t-=dt;if(c.one.t<=0&&c.one.n!=='death'){const a=c.act[c.one.n];a.setEffectiveWeight(0);a.stop();c.one=null}}

 c.mixer.update(dt)}

function placeProp(n,x,z,ry,len,collide){const src=PROPS[n];if(!src)return null;const o=src.clone(true);

 if(collide){g.updateMatrixWorld(true);const wb=new T.Box3().setFromObject(g);const c=wb.getCenter(new T.Vector3()),s=wb.getSize(new T.Vector3());const f=Math.abs(Math.sin(2*ry))>.15?.82:.94;

function pushOut(p,r,who){for(const c of COL){if(who==='z'&&!c.z||who==='p'&&!c.p)continue;const b=c.b;
 const cx=clamp(p.x,b.min.x,b.max.x),cz=clamp(p.z,b.min.z,b.max.z);let dx=p.x-cx,dz=p.z-cz;const d2=dx*dx+dz*dz;
 if(d2<r*r){if(d2<1e-8){const l=p.x-b.min.x,rr=b.max.x-p.x,t=p.z-b.min.z,bt=b.max.z-p.z;const m=Math.min(l,rr,t,bt);if(m===l)p.x=b.min.x-r;else if(m===rr)p.x=b.max.x+r;else if(m===t)p.z=b.min.z-r;else p.z=b.max.z+r}
  else{const d=Math.sqrt(d2);p.x=cx+dx/d*r;p.z=cz+dz/d*r}}}}

let AC=null,NB=null,MG=null;
function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.7;MG.connect(AC.destination);NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
function panNode(pan){if(AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=clamp(pan,-1,1);p.connect(MG);return p}return MG}
function noise(f,dur,vol,type='lowpass',pan=0,q=.8){if(!AC)return;const t=AC.currentTime,s=AC.createBufferSource();s.buffer=NB;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(fl);fl.connect(g);g.connect(panNode(pan));s.start(t,Math.random()*.5);s.stop(t+dur+.02)}
function tone(f0,f1,dur,vol,type='sine',pan=0){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(panNode(pan));o.start(t);o.stop(t+dur+.02)}

function raySeg(o,d,a,b){// 射线与线段最近距离
 const u=v1.subVectors(b,a),w0=v2.subVectors(o,a);const A=d.dot(d),B=d.dot(u),C=u.dot(u),D=d.dot(w0),E=u.dot(w0);const den=A*C-B*B;
 let sc=0,tc=0;if(den<1e-6){sc=0;tc=E/C}else{sc=(B*E-C*D)/den;tc=(A*E-B*D)/den}tc=clamp(tc,0,1);sc=Math.max(0,(tc*B-D)/A);
 const p1=v3.copy(o).addScaledVector(d,sc),p2=v4.copy(a).addScaledVector(u,tc);return{d:p1.distanceTo(p2),t:sc}}
function raySph(o,d,c,r){const oc=v1.subVectors(o,c);const b=oc.dot(d),cc=oc.dot(oc)-r*r,h=b*b-cc;if(h<0)return -1;const t=-b-Math.sqrt(h);return t>0?t:-1}
const HB={h:new T.Vector3(),ht:new T.Vector3(),hip:new T.Vector3(),nk:new T.Vector3(),lf:new T.Vector3(),rf:new T.Vector3(),hc:new T.Vector3()};
function zHit(z,o,d){const c=z.c,s=c.s*(TOUCH?1.45:1.08);let best=null;
 const hd=boneW(c,'mixamorighead',HB.h),ht=boneW(c,'mixamorigheadtop_end',HB.ht);
 if(hd){if(ht)HB.hc.addVectors(hd,ht).multiplyScalar(.5);else HB.hc.copy(hd).y+=.1*c.s;const t=raySph(o,d,HB.hc,.15*s);if(t>0)best={t,part:'head'}}
 const hip=boneW(c,'mixamorighips',HB.hip),nk=boneW(c,'mixamorigneck',HB.nk);
 if(hip&&nk){const r=raySeg(o,d,hip,nk);if(r.d<.26*s&&(!best||r.t<best.t-.25))best=best||{t:r.t,part:'body'}}
 if(hip){for(const f of['mixamorigleftfoot','mixamorigrightfoot']){const fp=boneW(c,f,HB.lf);if(!fp)continue;const r=raySeg(o,d,hip,fp);if(r.d<.13*s&&!best)best={t:r.t,part:'leg'}}}
 if(!hip){const t=raySph(o,d,v4.copy(z.c.wrap.position).setY(c.h*.6),.4*s);if(t>0)best={t,part:'body'}}
 return best}

const clock=new T.Clock();const PV3=new T.Vector3();let hudDirty=true,fpsAcc=0;
function update(dt){
 // 输入 → 移动
 const k=IN.k;let mx=(k.KeyD?1:0)-(k.KeyA?1:0),mz=(k.KeyW?1:0)-(k.KeyS?1:0);

 P.pos.x+=P.vel.x*dt;P.pos.z+=P.vel.z*dt;pushOut(P.pos,.38,'p');P.pos.x=clamp(P.pos.x,-34,34);P.pos.z=clamp(P.pos.z,-34,34);
 P.c.wrap.position.copy(P.pos);

 P.pitch=clamp(P.pitch+P.kickP*.6,-1.05,.75);P.kickP*=Math.pow(.0001,dt);if(P.kickP<1e-4)P.kickP=0;P.spr*=Math.pow(.02,dt);
 const cp=Math.cos(P.pitch),spp=Math.sin(P.pitch);camF.set(-Math.sin(P.yaw)*cp,spp,-Math.cos(P.yaw)*cp);camR.set(Math.cos(P.yaw),0,-Math.sin(P.yaw));

 // 回血

 for(const f of FIRES){f.t+=dt;const fl=.8+Math.sin(f.t*13)*.12+Math.sin(f.t*31)*.08;f.f.scale.set(1.1*fl,1.5*fl,1);if(f.li)f.li.intensity=2*fl}
 for(const s of SMOKES)s.sp.material.rotation+=s.v*dt;

 // HUD 动态

 const gap=(6+(WP[G.cur].spr*(P.aimOn?.45:1)*(P.vel.lengthSq()>1?1.5:1)+P.spr*.5)*420);xh(gap);
 $('rel').textContent=P.relT>0?'换弹中…':(G.ws[G.cur].mag===0&&G.ws[G.cur].res===0?'弹药耗尽！按 1 切手枪':'');
 if(hudDirty)hud();
}
function updZ(z,dt){const c=z.c,p=c.wrap.position;
 if(z.dead){z.deadT+=dt;if(z.deadT>3)p.y-=dt*.35;updChar(c,dt);return}
 z.hitCd-=dt;z.atkT-=dt;
 // 目标：在路障外先走向缺口
 let tx=P.pos.x,tz=P.pos.z;
 if(Math.abs(p.x)>33.4&&Math.abs(p.z)<11){tx=Math.sign(p.x)*32;tz=0;if(Math.abs(p.z)>1.4)tx=Math.sign(p.x)*34.4}
 else if(Math.abs(p.z)>33.4&&Math.abs(p.x)<11){tz=Math.sign(p.z)*32;tx=0;if(Math.abs(p.x)>1.4)tz=Math.sign(p.z)*34.4}
 let dx=tx-p.x,dz=tz-p.z;const dl=Math.hypot(dx,dz)||1;dx/=dl;dz/=dl;
 const pdx=P.pos.x-p.x,pdz=P.pos.z-p.z,pd=Math.hypot(pdx,pdz);
 const reach=z.r+.75;const busy=c.one&&(c.one.n==='punch'||c.one.n==='scream'||c.one.n==='hitreact'||c.one.n==='idle_attack');
 if(z.pend>0){z.pend-=dt;if(z.pend<=0){z.pend=-1;if(pd<reach+.5&&!P.dead)hurtP(z.dmg,p)}}
 let mv=0;
 if(!P.dead&&pd<reach){z.face=Math.atan2(pdx,pdz);if(z.atkT<=0&&!busy){playOnce(c,'punch',z.type==='boss'?1.3:1.7);z.pend=z.type==='boss'?.55:.42;z.atkT=z.type==='brute'?1.7:z.type==='boss'?1.5:1.15}}
 else if(!busy||c.one.n==='hitreact'&&false){
  // 分离 + 绕障
  let sx=0,sz=0;for(const o of G.zs){if(o===z||o.dead)continue;const ox=p.x-o.c.wrap.position.x,oz=p.z-o.c.wrap.position.z;const d2=ox*ox+oz*oz,rr=z.r+o.r;if(d2<rr*rr&&d2>1e-6){const d=Math.sqrt(d2);sx+=ox/d*(rr-d);sz+=oz/d*(rr-d)}}
  let vx=dx,vz=dz;if(z.detT>0){z.detT-=dt;vx+=-dz*z.det*1.2;vz+=dx*z.det*1.2;const l=Math.hypot(vx,vz);vx/=l;vz/=l}
  const s=P.dead?z.spd*.4:z.spd;p.x+=(vx*s)*dt+sx*Math.min(1,dt*8);p.z+=(vz*s)*dt+sz*Math.min(1,dt*8);pushOut(p,z.r*.8,'z');
  const moved=Math.hypot(p.x-z.last.x,p.z-z.last.y);z.last.set(p.x,p.z);mv=moved/dt;
  if(mv<s*.35&&pd>reach+.3){z.stuck+=dt;if(z.stuck>.45){z.stuck=0;z.det=Math.random()<.5?1:-1;z.detT=rand(.8,1.6)}}else z.stuck=Math.max(0,z.stuck-dt);
  z.face=Math.atan2(vx,vz)}
 let df=z.face-c.wrap.rotation.y;df=Math.atan2(Math.sin(df),Math.cos(df));c.wrap.rotation.y+=df*Math.min(1,dt*7);
 if(z.type==='runner'||z.spd>2)setBase(c,'run',clamp(z.spd/3.1,.7,1.4));else if(mv>.05||!busy)setBase(c,'walk',clamp(z.spd/.62,.8,2.2)*(z.type==='brute'?.75:1));
 if(pd<reach&&!busy)setBase(c,'idle',1);
 updChar(c,dt);
 // 呻吟
 z.groan-=dt;if(z.groan<=0){z.groan=rand(4,9);if(pd<26&&AC){const a=Math.atan2(p.x-P.pos.x,p.z-P.pos.z)-(P.yaw+Math.PI);sGroan(.12*(1-pd/28)*(z.type==='boss'?2.5:1),-Math.sin(a),z.type==='boss'||z.type==='brute')}}}
function waveClear(){const bonus=100+G.wave*25;G.cash+=bonus;G.score+=G.wave*500;G.inter=22;banner('第 '+G.wave+' 波已清除','奖励 $'+bonus,2.6);say('本波尸潮已清除，前往补给站');sCash();

// ================= 商店 =================
function openShop(){if(G.inter<=0||G.state!=='play')return;G.shop=true;$('shop').classList.remove('hid');if(document.pointerLockElement)document.exitPointerLock();renderShop()}

function buy(c){if(G.cash<c)return false;G.cash-=c;sCash();return true}
function renderShop(){$('shopCash').textContent='资金 $'+G.cash;const gr=$('shopGrid');gr.innerHTML='';
 WP.forEach((w,i)=>{const s=G.ws[i],st=wStat(i);const d=document.createElement('div');d.className='card';
  const up=Math.round((w.price||400)*.55*s.lv);const desc=['可靠的副武器，子弹无限','射速快，近距离清怪','一枪 9 发弹丸，近身击退','高伤害，可穿透 2 只丧尸'][i];
  d.innerHTML=`<h3>${w.n}${s.own?'<span style="font-size:12px;color:#f0c08a"> Lv.'+s.lv+'</span>':''}</h3><p>${desc}<br>伤害 ${Math.round(st.dmg)}${w.pel>1?'×'+w.pel:''} · 弹匣 ${st.mag}</p>`;
  const mk=(t,cost,fn,dis)=>{const b=document.createElement('button');b.className='btn';b.textContent=t+(cost?' $'+cost:'');b.disabled=dis||G.cash<cost;b.onclick=()=>{if(buy(cost)){fn();renderShop();hud()}};d.appendChild(b)};
  if(!s.own)mk('购买',w.price,()=>{s.own=true;s.mag=st.mag;s.res=st.res;equip(i)});
  else{mk(s.lv>=5?'已满级':'升级',s.lv>=5?0:up,()=>{s.lv++;const n=wStat(i);s.mag=n.mag},s.lv>=5);
   if(w.res!==Infinity)mk('补满弹药',w.ammoP,()=>{s.res=wStat(i).res;s.mag=wStat(i).mag},s.res>=st.res&&s.mag>=st.mag)}
  gr.appendChild(d)});
 const it=[['医疗包','恢复 60 点生命',150,()=>P.hp=Math.min(100,P.hp+60),P.hp>=100],['防弹护甲','护甲补满 100，吸收 60% 伤害',300,()=>P.ar=100,P.ar>=100]];
 for(const [n,ds,c,fn,dis] of it){const d=document.createElement('div');d.className='card';d.innerHTML=`<h3>${n}</h3><p>${ds}</p>`;const b=document.createElement('button');b.className='btn';b.textContent='购买 $'+c;b.disabled=dis||G.cash<c;b.onclick=()=>{if(buy(c)){fn();renderShop();hud()}};d.appendChild(b);gr.appendChild(d)}}
$('bShopClose').onclick=()=>{closeShop();if(!TOUCH)lock()};$('bNext').onclick=()=>{G.inter=0;$('msg').textContent='';nextWave();if(!TOUCH)lock()};
$('tShop').addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();openShop()},{passive:false});
