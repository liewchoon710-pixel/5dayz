<!DOCTYPE html>
<html lang="zh-CN">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0e10;color:#e8e2d6;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}

.hid{display:none!important}
h1{font-size:clamp(34px,7vw,64px);letter-spacing:.12em;color:#e9d9b8;text-shadow:0 0 18px rgba(200,40,20,.55),0 3px 0 #3a0d08}

.btn{background:linear-gradient(#8b1d12,#5a0f08);border:1px solid #c4523c;color:#fbe9d8;padding:11px 28px;font-size:17px;border-radius:6px;cursor:pointer;letter-spacing:.15em;margin:5px;min-width:150px}
.btn:hover{filter:brightness(1.18)}
.btn.g{background:linear-gradient(#3a3b3e,#232427);border-color:#6a6b70}

.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.chip{border:1px solid #6a5a4a;background:#1d1a17;color:#d9cbb6;padding:7px 14px;border-radius:20px;cursor:pointer;font-size:14px}

.lbl{font-size:13px;opacity:.65;margin-top:10px;letter-spacing:.15em}

#loadbar{width:min(360px,70vw);height:6px;background:#2a2522;border-radius:3px;overflow:hidden;margin-top:14px}

#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.tl{position:absolute;left:max(14px,env(safe-area-inset-left));top:12px;font-size:15px;text-shadow:0 1px 3px #000}

.bl{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:14px;width:min(260px,34vw)}
.bar{height:12px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.18);border-radius:3px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;width:100%;transition:width .15s}
#hpf{background:linear-gradient(90deg,#9b1c12,#e3452c)}
#arf{background:linear-gradient(90deg,#2b5a8a,#58a0e0)}

#slots span{font-size:11px;padding:2px 7px;border:1px solid rgba(255,255,255,.2);border-radius:3px;background:rgba(0,0,0,.4);opacity:.45}
#slots span.own{opacity:.85}#slots span.cur{opacity:1;border-color:#e0664c;background:rgba(140,30,18,.6)}
#xh{position:absolute;left:50%;top:50%;width:0;height:0}

#xh .dot{width:3px;height:3px;left:-1.5px;top:-1.5px;border-radius:50%}
#hm{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;opacity:0;transition:opacity .12s}
#hm:before,#hm:after{content:"";position:absolute;left:12px;top:0;width:2px;height:26px;background:#fff;transform:rotate(45deg)}
#hm:after{transform:rotate(-45deg)}
#hm.hs:before,#hm.hs:after{background:#ff4a2e}
#pop{position:absolute;left:50%;top:41%;transform:translateX(-50%);font-size:18px;font-weight:700;color:#ff6a48;text-shadow:0 0 6px #000;opacity:0;transition:opacity .3s}
#banner{position:absolute;left:0;right:0;top:22%;text-align:center;font-size:clamp(26px,5vw,46px);letter-spacing:.2em;color:#f2d3a8;text-shadow:0 0 16px rgba(220,40,20,.8),0 2px 0 #000;opacity:0;transition:opacity .5s}
#banner small{display:block;font-size:.42em;letter-spacing:.15em;opacity:.8;margin-top:6px}
#msg{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:15px;color:#ffd9a0;text-shadow:0 1px 3px #000}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(160,0,0,.75));opacity:0}
.dmg{position:absolute;opacity:0;transition:opacity .25s}
#dF{left:0;right:0;top:0;height:40%;background:radial-gradient(ellipse 45% 70% at 50% 0%,rgba(220,0,0,.6),transparent 100%)}
#dB{left:0;right:0;bottom:0;height:40%;background:radial-gradient(ellipse 45% 70% at 50% 100%,rgba(220,0,0,.6),transparent 100%)}
#dL{top:0;bottom:0;left:0;width:35%;background:radial-gradient(ellipse 70% 45% at 0% 50%,rgba(220,0,0,.6),transparent 100%)}
#dR{top:0;bottom:0;right:0;width:35%;background:radial-gradient(ellipse 70% 45% at 100% 50%,rgba(220,0,0,.6),transparent 100%)}
#rel{position:absolute;left:50%;top:58%;transform:translateX(-50%);font-size:14px;color:#fff;text-shadow:0 1px 3px #000}
#portrait{position:absolute;left:50%;top:70px;transform:translateX(-50%);font-size:12px;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:12px}
/* touch */
body.touch .br{right:auto;left:50%;transform:translateX(-50%);bottom:6px;text-align:center}
body.touch #ammo{font-size:24px}body.touch #ammo small{font-size:13px}body.touch #wname{font-size:12px}
body.touch #slots{justify-content:center}body.touch #slots span{font-size:10px;padding:1px 5px}

#touch{position:fixed;inset:0;z-index:11;pointer-events:none}

#tFire{width:84px;height:84px;right:calc(28px + env(safe-area-inset-right));bottom:120px;font-size:17px;background:rgba(140,26,16,.5)}

#tShop{width:58px;height:58px;right:calc(200px + env(safe-area-inset-right));bottom:60px;font-size:13px}
#joyB{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.2);display:none}
#joyK{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.35);left:34px;top:34px}
/* shop */
#shop{position:fixed;inset:0;z-index:25;background:rgba(6,6,8,.82);display:flex;align-items:center;justify-content:center}

#shopHd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap}
#shopHd h2{font-size:20px;letter-spacing:.15em;color:#f0c08a}
#shopCash{font-size:18px;color:#9fe08a}
#shopGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.card{background:#211f24;border:1px solid #3a3540;border-radius:8px;padding:10px}
.card h3{font-size:16px;margin-bottom:3px}
.card p{font-size:12px;opacity:.7;line-height:1.5;min-height:36px}
.card .btn{min-width:0;width:100%;padding:7px 6px;font-size:13px;margin:5px 0 0;letter-spacing:.05em}
#shopFt{display:flex;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap;gap:8px}
#shopT{font-size:15px;opacity:.85}
.stat{font-size:15px;line-height:2;text-align:center}
.stat b{color:#f0c08a}
input{user-select:text;-webkit-user-select:text;background:#141316;border:1px solid #5a4a3c;color:#f2e6d2;padding:8px 10px;border-radius:6px;font-size:15px;width:150px;text-align:center;font-family:inherit}
body.pvp .zOnly{display:none!important}body:not(.pvp) .pOnly{display:none!important}
#pvpBar{position:absolute;left:50%;top:8px;transform:translateX(-50%);font-size:15px;text-shadow:0 1px 3px #000;white-space:nowrap;background:rgba(0,0,0,.35);padding:3px 14px;border-radius:14px}
#pvpBar b{font-size:24px;margin:0 6px}
body.touch #pvpBar{top:52px}
#feed{display:flex;flex-direction:column;align-items:flex-end;position:absolute;right:max(14px,env(safe-area-inset-right));top:62px;text-align:right;font-size:13px;line-height:1.7;text-shadow:0 1px 3px #000}
#feed div{background:rgba(0,0,0,.35);padding:0 8px;border-radius:4px;margin-bottom:2px;display:inline-block}
#feed i{font-style:normal;opacity:.7;margin:0 4px}
#board{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:15;background:rgba(14,13,16,.9);border:1px solid #4a3a30;border-radius:10px;padding:12px 16px;min-width:min(520px,92vw);max-height:84vh;overflow:auto}
#board table{width:100%;border-collapse:collapse;font-size:14px}#board td,#board th{padding:4px 8px;text-align:left}#board th{opacity:.6;font-weight:400;font-size:12px}
#board tr.me td{color:#ffd28a}
.lbBox{background:#17161a;border:1px solid #4a3a30;border-radius:10px;padding:14px 18px;width:min(560px,94vw);max-height:92vh;overflow:auto;text-align:center}
#lbList{margin:10px 0;text-align:left}
#lbList .pl{display:flex;justify-content:space-between;padding:6px 10px;border-bottom:1px solid #2a2630;font-size:15px}
#lbLink{font-size:12px;opacity:.7;word-break:break-all;margin-top:4px}
#menu,#lobby,.lbBox,#shopIn,#over,#board{touch-action:pan-y}
@media (max-height:520px){h1{font-size:30px!important}.sub{display:none}.lbl{margin-top:3px;font-size:12px}.chip{padding:5px 11px;font-size:13px}.btn{padding:8px 16px;font-size:15px}.help{display:none}#lbRoom{font-size:26px!important}#menu .row{margin:3px 0}input{padding:5px 8px}}
#tBoard{width:40px;height:40px;left:50%;margin-left:28px;top:8px;font-size:13px}
</style>
</head>
<body>
<canvas id="c"></canvas>

  <div class="tb" id="tFire2">开火</div>

</div>

<div id="load" class="ov"><h1>尸城枪火</h1><div class="sub">尸城五日 · 尸潮射击</div><div id="loadT">正在载入素材…</div><div id="loadbar"><div id="loadfill"></div></div></div>

  <div class="row"><input id="nm" maxlength="8" placeholder="你的名字"></div>

</div></div>

<script>
'use strict';
const T=THREE,$=id=>document.getElementById(id);
const TOUCH=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window&&navigator.maxTouchPoints>0&&!matchMedia('(pointer:fine)').matches);
// 素材来源：放在 5dayz 仓库里时直接读 ../assets/，其它地方读 jsDelivr 上的 cdn 分支
const BASE=(()=>{try{const m=document.querySelector('meta[name=asset-base]');if(m&&m.content)return m.content;const h=location.hostname;if(/github\.io$/.test(h)||h==='localhost'||h==='127.0.0.1')return '../assets/'}catch(e){}return 'https://cdn.jsdelivr.net/gh/liewchoon710-pixel/5dayz@0614e26d28c75290e999d2d535d0b2b2e5b9f74e/'})();
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[Math.floor(Math.random()*a.length)];
const r2=v=>Math.round(v*100)/100,wrapA=a=>Math.atan2(Math.sin(a),Math.cos(a));
let seed=7;const srand=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
// ================= 渲染器 =================
const renderer=new T.WebGLRenderer({canvas:$('c'),antialias:!TOUCH,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,TOUCH?1.25:1.75));
renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();const FOGC=0x1b1c20;scene.background=new T.Color(FOGC);scene.fog=new T.FogExp2(FOGC,.026);
const camera=new T.PerspectiveCamera(65,1,.08,220);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();$('portrait').classList.toggle('hid',!(TOUCH&&h>w))}
addEventListener('resize',resize);resize();if(TOUCH)document.body.classList.add('touch');
scene.add(new T.HemisphereLight(0x8d99ab,0x2c2118,.62));
const sun=new T.DirectionalLight(0xffb489,1.35);sun.position.set(28,42,-18);sun.castShadow=true;
sun.shadow.mapSize.set(TOUCH?1024:2048,TOUCH?1024:2048);const sc=sun.shadow.camera;sc.left=-46;sc.right=46;sc.top=46;sc.bottom=-46;sc.near=1;sc.far=120;sun.shadow.bias=-.0006;sun.shadow.normalBias=.03;
scene.add(sun);scene.add(sun.target);

function ctex(s,draw){const c=document.createElement('canvas');c.width=c.height=s;draw(c.getContext('2d'),s);const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;return t}

// 用最简单的 fetch(网址) 取文件，再自行解析——兼容 Claude App 文件预览等受限环境
async function getBuf(url){let last;for(let i=0;i<3;i++){try{const r=await fetch(url,{mode:'cors'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.arrayBuffer()}catch(e){last=e;await new Promise(r=>setTimeout(r,400*(i+1)))}}
 return await new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open('GET',url);x.responseType='arraybuffer';x.onload=()=>x.status<400?res(x.response):rej(last||new Error('HTTP '+x.status));x.onerror=()=>rej(last||new Error('网络错误'));x.send()})}
const FAILS=[];

function raySeg(o,d,a,b){const u=v1.subVectors(b,a),w0=v2.subVectors(o,a);const A=d.dot(d),B=d.dot(u),C=u.dot(u),D=d.dot(w0),E=u.dot(w0);const den=A*C-B*B;
 let sc=0,tc=0;if(den<1e-6){sc=0;tc=E/C}else{sc=(B*E-C*D)/den;tc=(A*E-B*D)/den}tc=clamp(tc,0,1);sc=Math.max(0,(tc*B-D)/A);
 const p1=v3.copy(o).addScaledVector(d,sc),p2=v4.copy(a).addScaledVector(u,tc);return{d:p1.distanceTo(p2),t:sc}}
function raySph(o,d,c,r){const oc=v1.subVectors(o,c);const b=oc.dot(d),cc=oc.dot(oc)-r*r,h=b*b-cc;if(h<0)return -1;const t=-b-Math.sqrt(h);return t>0?t:-1}
const HB={h:new T.Vector3(),ht:new T.Vector3(),hip:new T.Vector3(),nk:new T.Vector3(),lf:new T.Vector3(),hc:new T.Vector3()};
function charHit(c,o,d){const s=c.s*(TOUCH?1.35:1.08);let best=null;
 const hd=boneW(c,'mixamorighead',HB.h),ht=boneW(c,'mixamorigheadtop_end',HB.ht);
 if(hd){if(ht)HB.hc.addVectors(hd,ht).multiplyScalar(.5);else HB.hc.copy(hd).y+=.1*c.s;const t=raySph(o,d,HB.hc,.15*s);if(t>0)best={t,part:'head'}}
 const hip=boneW(c,'mixamorighips',HB.hip),nk=boneW(c,'mixamorigneck',HB.nk);
 if(hip&&nk&&!best){const r=raySeg(o,d,hip,nk);if(r.d<.26*s)best={t:r.t,part:'body'}}
 if(hip&&!best){for(const f of['mixamorigleftfoot','mixamorigrightfoot']){const fp=boneW(c,f,HB.lf);if(!fp)continue;const r=raySeg(o,d,hip,fp);if(r.d<.13*s){best={t:r.t,part:'leg'};break}}}
 if(!hip){const t=raySph(o,d,v4.copy(c.wrap.position).setY(c.h*.6),.4*s);if(t>0)best={t,part:'body'}}
 return best}
const WTV=new T.Vector3();
function wallT(o,d,max){let tmin=max;ray.origin.copy(o);ray.direction.copy(d);for(const c of COL){if(!c.r)continue;const p=ray.intersectBox(c.b,WTV);if(p){const t=p.distanceTo(o);if(t<tmin)tmin=t}}
 if(d.y<-1e-4){const t=-o.y/d.y;if(t<tmin)tmin=t}return tmin}
function targetsForMe(){const L=[];if(G.mode==='z'){for(const z of G.zs)if(!z.dead)L.push({k:'z',z,c:z.c,pos:z.c.wrap.position})}
 else for(const id in HUM){const H=HUM[id];if(!H.dead&&H.team!==P.team)L.push({k:'h',H,c:H.c,pos:H.pos})}return L}
function queueHit(v,d,hd){const h=NET.out.h.find(x=>x[0]===v);if(h){h[1]+=d;h[2]=h[2]||hd?1:0}else NET.out.h.push([v,d,hd?1:0,G.cur])}
const camF=new T.Vector3(),camR=new T.Vector3(),muz=new T.Vector3();
function fire(){const i=G.cur,w=WP[i],s=G.ws[i],st=wStat(i);if(P.relT>0||P.fireCd>0||P.dead)return;
 if(s.mag<=0){sClick();P.fireCd=.25;reload();return}
 s.mag--;P.fireCd=w.rate;P.spr=Math.min(P.spr+w.kick*1.6,.08);P.prot=0;
 const g=P.guns[i];muz.copy(g.userData.tip);g.localToWorld(muz);
 flashS.position.copy(muz);flashS.scale.setScalar(w.id==='shotgun'?.75:.5);flashS.material.rotation=rand(0,6);flashS.visible=true;flashS.userData.t=.05;flashL.position.copy(muz);flashL.intensity=3;
 sGun(w);
 const moving=P.vel.lengthSq()>1;const base=w.spr*(P.aimOn?.45:1)*(moving?1.5:1)+P.spr*.5;
 let any=false,head=false;const TG=targetsForMe();const dm=G.mode==='pvp'?PVP_DMG:1;
 for(let k=0;k<w.pel;k++){
  const d=new T.Vector3().copy(camF);d.x+=rand(-1,1)*base;d.y+=rand(-1,1)*base;d.z+=rand(-1,1)*base;d.normalize();
  const o=camera.position;const wt=wallT(o,d,140);
  const hits=[];for(const tg of TG){if(tg.pos.distanceTo(o)>wt+2)continue;const h=charHit(tg.c,o,d);if(h&&h.t<wt&&h.t>.5)hits.push([h,tg])}
  hits.sort((a,b)=>a[0].t-b[0].t);
  let end=wt,n=0;const maxN=1+(w.pierce||0);
  for(const [h,tg] of hits){if(n>=maxN)break;n++;end=h.t;const hd=h.part==='head';const dmg=st.dmg*(hd?w.head:h.part==='leg'?.7:1)*dm;any=true;if(hd)head=true;
   const hp=v2.copy(o).addScaledVector(d,h.t);emit(hp,hd?14:8,[.55,.03,.02],hd?4:2.6,.6);
   if(tg.k==='z'){if(isHost())hurtZ(tg.z,dmg,hd,d,w.push||0,NET.me);else{tg.z.c.flash=.08;queueHit('z'+tg.z.id,dmg,hd)}}
   else{if(tg.H.bot&&isHost())hurtBot(tg.H,dmg,NET.me,hd,i);else{tg.H.c.flash=.08;queueHit(tg.H.id,dmg,hd)}}}
  const ep=v3.copy(o).addScaledVector(d,end);tracer(muz,ep);
  if(n===0&&end<139)emit(ep,5,[1,.8,.4],3,.9,9.8,.35);
  if(NET.on&&k<3)NET.out.f.push([i,r2(muz.x),r2(muz.y),r2(muz.z),r2(ep.x),r2(ep.y),r2(ep.z)])}
 if(any){hitMark(head);if(head)sHead();else sFlesh()}
 P.rec+=w.kick*(TOUCH?.45:1)*(P.aimOn?.6:1);if(!TOUCH)P.yaw+=rand(-1,1)*w.kick*.12;
 if(s.mag===0)setTimeout(()=>{if(G.ws&&G.ws[i].mag===0&&G.cur===i)reload()},180);
 hud()}
function remoteShot(f){const [w,ox,oy,oz,ex,ey,ez]=f;const W=WP[w]||WP[0];v1.set(ox,oy,oz);v2.set(ex,ey,ez);tracer(v1,v2);emit(v2,3,[1,.8,.4],2.5,.9,9.8,.3);
 const d=v1.distanceTo(P.pos);if(d<70&&AC){const a=Math.atan2(ox-P.pos.x,oz-P.pos.z)-(P.yaw+Math.PI);sGun(W,clamp(1-d/70,.06,.8),-Math.sin(a))}}
function hurtZ(z,dmg,head,dir,push,killer){z.hp-=dmg;z.c.flash=.08;
 if(push&&dir){z.c.wrap.position.x+=dir.x*push*.4;z.c.wrap.position.z+=dir.z*push*.4}

 if(z.type!=='boss'&&z.hitCd<=0&&!(z.c.one&&(z.c.one.n==='punch'||z.c.one.n==='standup'))&&(head||z.type!=='brute')){z.hitCd=z.type==='brute'?1.4:.55;playOnce(z.c,'hitreact',1.5)}

function killZ(z,head,killer){z.dead=true;z.deadT=0;playOnce(z.c,'death',1.1);const t=z.t;let cash=t.cash,pts=t.pts;if(head){cash=Math.round(cash*1.5);pts=Math.round(pts*1.5)}

const pkM={ammo:new T.MeshStandardMaterial({color:0x6a7a3a,emissive:0x2a3a08,roughness:.6}),med:new T.MeshStandardMaterial({color:0xe8e4dc,emissive:0x5a1010,roughness:.6})};

function hurtP(d,from,attacker,hd,w){if(P.dead||P.prot>0||G.state!=='play')return;if(P.ar>0){const a=Math.min(P.ar,d*.6);P.ar-=a;d-=a}P.hp-=d;P.hurtT=1;P.regenT=5;P.shake=.25;sHurt();
 if(from){const a=Math.atan2(from.x-P.pos.x,from.z-P.pos.z);let rel=wrapA(a-(P.yaw+Math.PI));
  const id=Math.abs(rel)<Math.PI/4?'dF':Math.abs(rel)>3*Math.PI/4?'dB':rel>0?'dL':'dR';const e=$(id);e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,350)}
 if(P.hp<=0){P.hp=0;P.dead=true;G.deaths++;playOnce(P.c,'death',1);P.guns.forEach(g=>g.visible=false);closeShop();
  if(G.mode==='pvp'){P.respT=5;emitKill({k:attacker||'Z',v:NET.me,hd:hd?1:0,w:w|0})}else{emitKill({k:'Z',v:NET.me,hd:0,w:0});if(!NET.on)say('你已阵亡')}}

 if(isHost()){const kv=rost(o.v);kv.d++;if(o.k!=='Z'&&o.k!==o.v){const kk=rost(o.k);const tk=teamOf(o.k),tv=teamOf(o.v);if(G.mode!=='pvp'||tk!==tv){kk.k++;if(G.mode==='pvp'&&tk>=0)G.sc[tk]++}}}
 if(o.k===NET.me&&o.v!==NET.me){G.kills++;if(o.hd)G.heads++;popTxt((o.hd?'爆头击杀 ':'击杀 ')+nameOf(o.v));sCash()}
 hud(true)}

 const nc=id=>`<span style="color:${G.mode==='pvp'&&teamOf(id)>=0?TEAM_CSS[teamOf(id)]:'#ddd'}">${nameOf(id)}</span>`;
 d.innerHTML=nc(o.k)+`<i>${o.k==='Z'?'咬死了':WP[o.w]?WP[o.w].n:''}${o.hd?' · 爆头':''}</i>`+nc(o.v);f.appendChild(d);while(f.children.length>5)f.removeChild(f.firstChild);setTimeout(()=>d.remove(),6000)}

function syncBots(){if(G.mode!=='pvp'||!isHost())return;const hum=[0,0];hum[P.team]++;for(const id in HUM){const H=HUM[id];if(!H.bot)hum[H.team]++}
 for(const t of[0,1]){const bots=Object.values(HUM).filter(H=>H.bot&&H.team===t);const want=G.cfg.ai?Math.max(0,TEAM_MAX-hum[t]):0;
  for(let i=bots.length;i<want;i++)addBot(t);for(let i=want;i<bots.length;i++)removeHuman(bots[i].id)}}
function addBot(t){const used=new Set(Object.values(HUM).map(h=>h.name));const nm='电脑·'+(BOTN.find(n=>!used.has('电脑·'+n))||G.bid);
 const B=makeHuman('b'+(++G.bid),{name:nm,team:t,sk:Math.floor(Math.random()*HUMANS.length),bot:true,w:pick([1,3,3])});
 B.ai={goal:null,tgt:null,scan:0,react:0,fireCd:0,strafe:1,strT:0,stuck:0,det:0,detT:0,last:new T.Vector2()};rost(B.id);G.R[B.id].n=nm;G.R[B.id].t=t;respawnBot(B)}
function respawnBot(B){const s=B.team===0?1:-1;B.pos.set(s*rand(27,30.5),0,rand(-6,6));B.yaw=s>0?Math.PI/2:-Math.PI/2;B.hp=100;B.prot=2;setDead(B,false);B.ai.tgt=null;B.ai.goal=null}
function hurtBot(B,d,k,hd,w){if(B.dead||B.prot>0)return;B.hp-=d;B.c.flash=.08;if(B.ai)B.ai.scan=0;
 if(B.hp<=0){B.hp=0;setDead(B,true);B.respT=5;emitKill({k,v:B.id,hd:hd?1:0,w:w|0})}}
function chestOf(a,out){const h=a.c&&boneW(a.c,'mixamorigspine2',out);if(h)return out;return out.set(a.pos.x,1.25,a.pos.z)}
function canSee(from,a){const e=v1.set(from.x,1.5,from.z);const t=chestOf(a,new T.Vector3());const d=t.clone().sub(e);const L=d.length();d.divideScalar(L);return wallT(e,d,L)>=L-.4}
function findEnemy(B){let best=null,bd=55;for(const a of actors()){if(a.dead||a.team===B.team||a.id===B.id)continue;const d=Math.hypot(a.pos.x-B.pos.x,a.pos.z-B.pos.z);if(d<bd&&canSee(B.pos,a)){bd=d;best=a}}return best}
const GOALS=[[0,0],[14,0],[-14,0],[0,14],[0,-14],[24,4],[-24,-4],[4,24],[-4,-24],[8,8],[-8,-8]];
function updBot(B,dt){const ai=B.ai;if(B.dead){B.respT-=dt;if(B.respT<=0)respawnBot(B);return}
 if(B.prot>0)B.prot-=dt;const D=DIFF[diffI];
 ai.scan-=dt;if(ai.scan<=0){ai.scan=.3;const t=findEnemy(B);if(t&&(!ai.tgt||ai.tgt.id!==t.id))ai.react=rand(.35,.75)/D.acc;ai.tgt=t;if(t&&t.me)ai.tgt=meActor()}
 if(ai.tgt&&(ai.tgt.me?P.dead:ai.tgt.dead))ai.tgt=null;
 let mx=0,mz=0,spd=3.9;
 if(ai.tgt){const t=ai.tgt,tp=t.me?P.pos:t.pos;const dx=tp.x-B.pos.x,dz=tp.z-B.pos.z,d=Math.hypot(dx,dz)||1;
  B.yaw+=wrapA(Math.atan2(-dx,-dz)-B.yaw)*Math.min(1,dt*7);B.pitch=Math.atan2(-.25,d);
  ai.strT-=dt;if(ai.strT<=0){ai.strT=rand(.8,2);ai.strafe=Math.random()<.5?-1:1}
  const fx=dx/d,fz=dz/d,fw=d>22?1:d<7?-.6:0;mx=fx*fw-fz*ai.strafe*.7;mz=fz*fw+fx*ai.strafe*.7;spd=d>22?3.9:2.5;
  ai.react-=dt;ai.fireCd-=dt;if(ai.react<=0&&ai.fireCd<=0)botFire(B,t,d)}
 else{if(!ai.goal||Math.hypot(ai.goal[0]-B.pos.x,ai.goal[1]-B.pos.z)<2.5){const es=B.team===0?-1:1;ai.goal=Math.random()<.35?[es*rand(20,28),rand(-5,5)]:pick(GOALS)}
  const dx=ai.goal[0]-B.pos.x,dz=ai.goal[1]-B.pos.z,d=Math.hypot(dx,dz)||1;mx=dx/d;mz=dz/d;B.yaw+=wrapA(Math.atan2(-mx,-mz)-B.yaw)*Math.min(1,dt*5);B.pitch=0}
 if(ai.detT>0){ai.detT-=dt;const ox=mx;mx+=-mz*ai.det*1.2;mz+=ox*ai.det*1.2}
 const ml=Math.hypot(mx,mz);if(ml>1e-3){mx/=ml;mz/=ml}
 B.pos.x+=mx*spd*dt;B.pos.z+=mz*spd*dt;pushOut(B.pos,.38,'p');B.pos.x=clamp(B.pos.x,-34,34);B.pos.z=clamp(B.pos.z,-34,34);
 const mv=Math.hypot(B.pos.x-ai.last.x,B.pos.z-ai.last.y)/dt;ai.last.set(B.pos.x,B.pos.z);
 if(ml>1e-3&&mv<spd*.3){ai.stuck+=dt;if(ai.stuck>.5){ai.stuck=0;ai.det=Math.random()<.5?1:-1;ai.detT=rand(.7,1.4);ai.goal=null}}else ai.stuck=Math.max(0,ai.stuck-dt);
 const fwd=-(Math.sin(B.yaw)*mx+Math.cos(B.yaw)*mz);B.a=mv<.3?0:spd>3.5&&fwd>.5?2:fwd<-.3?3:1}
function botFire(B,t,d){const W=WP[B.w],D=DIFF[diffI],ai=B.ai;ai.fireCd=W.rate*rand(1.5,2.6);
 if(!canSee(B.pos,t)){ai.tgt=null;return}
 const tp=t.me?P.pos:t.pos;const moving=t.me?P.vel.lengthSq()>2:false;
 const p=clamp(.7-d*.014,.12,.62)*D.acc*(moving?.8:1);const hit=Math.random()<p,hd=hit&&Math.random()<.12;
 const g=B.guns[B.w];muz.copy(g.userData.tip);g.localToWorld(muz);const ep=chestOf(t,new T.Vector3());if(!hit){ep.x+=rand(-.8,.8);ep.y+=rand(-.4,.6);ep.z+=rand(-.8,.8)}
 tracer(muz,ep);flashS.position.copy(muz);flashS.visible=true;flashS.userData.t=.04;
 const dd=muz.distanceTo(P.pos);if(AC&&dd<70){const a=Math.atan2(muz.x-P.pos.x,muz.z-P.pos.z)-(P.yaw+Math.PI);sGun(W,clamp(1-dd/70,.06,.8),-Math.sin(a))}
 if(NET.on)NET.H.f.push([B.w,r2(muz.x),r2(muz.y),r2(muz.z),r2(ep.x),r2(ep.y),r2(ep.z)]);
 if(!hit)return;const dmg=W.dmg*(hd?W.head*.6:1)*.8*PVP_DMG;
 if(t.me)hurtP(dmg,B.pos,B.id,hd,B.w);else if(t.bot)hurtBot(t,dmg,B.id,hd,B.w);else NET.H.bh.push([t.id,r2(dmg),hd?1:0,B.id,B.w])}

// ---------- 房主模拟 ----------
function hostSim(dt){
 if(G.mode==='z'){
  if(G.queue.length){G.spawnT-=dt;const cap=TOUCH?14:22;if(G.spawnT<=0&&aliveZ()<cap){const at=spawnSpot();const pack=Math.min(G.queue.length,G.wave<3?2:G.wave<6?3:4);for(let i=0;i<pack;i++)spawnZ(G.queue.shift(),at);G.spawnT=Math.max(1.2,3.2-G.wave*.15)}}
  for(let i=G.zs.length-1;i>=0;i--){const z=G.zs[i];updZ(z,dt);if(z.dead&&z.deadT>5){scene.remove(z.c.wrap);G.zs.splice(i,1)}}
  if(!G.queue.length&&aliveZ()===0&&!G.inter&&G.wave>0){G.inter=20;onWaveClear(G.wave)}
  if(G.inter>0){G.inter-=dt;if(G.inter<=0){G.inter=0;nextWave()}}
  const allDead=actors().filter(a=>!a.bot).every(a=>a.dead);if(allDead){G.allDeadT+=dt;if(G.allDeadT>2)hostEnd()}else G.allDeadT=0}
 else{G.tl-=dt;G.botT-=dt;if(G.botT<=0){G.botT=2;syncBots()}
  for(const id in HUM){const H=HUM[id];if(H.bot)updBot(H,dt)}
  if(G.sc[0]>=PVP_KILLS||G.sc[1]>=PVP_KILLS||G.tl<=0)hostEnd()}}
function updZ(z,dt){const c=z.c,p=c.wrap.position;
 if(z.dead){z.deadT+=dt;if(z.deadT>3)p.y-=dt*.35;z.st=4;updChar(c,dt);return}
 z.hitCd-=dt;z.atkT-=dt;
 let tg=null,td=1e9;for(const a of actors()){if(a.dead||a.bot)continue;const d=Math.hypot(a.pos.x-p.x,a.pos.z-p.z);if(d<td){td=d;tg=a}}
 let tx=tg?tg.pos.x:0,tz=tg?tg.pos.z:0;
 if(Math.abs(p.x)>33.4&&Math.abs(p.z)<11){tx=Math.sign(p.x)*32;tz=0;if(Math.abs(p.z)>1.4)tx=Math.sign(p.x)*34.4}
 else if(Math.abs(p.z)>33.4&&Math.abs(p.x)<11){tz=Math.sign(p.z)*32;tx=0;if(Math.abs(p.x)>1.4)tz=Math.sign(p.z)*34.4}
 let dx=tx-p.x,dz=tz-p.z;const dl=Math.hypot(dx,dz)||1;dx/=dl;dz/=dl;
 const reach=z.r+.75;const on=c.one&&c.one.n;const busy=on&&['punch','scream','hitreact','standup'].includes(on);
 if(z.pend>0){z.pend-=dt;if(z.pend<=0){z.pend=-1;const a=actors().find(a=>a.id===z.tid);if(a&&!a.dead&&Math.hypot(a.pos.x-p.x,a.pos.z-p.z)<reach+.5){if(a.me)hurtP(z.dmg,p,'Z');else NET.H.zh.push([a.id,r2(z.dmg),r2(p.x),r2(p.z)])}}}

document.addEventListener('touchend',tEnd);document.addEventListener('touchcancel',tEnd);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!NET.on)pause(true)});

// ---------- 主循环 ----------
let menuZ=[];
function loop(){requestAnimationFrame(loop);let dt=clock.getDelta();dt=Math.min(dt,.05);
 if(G.state==='play'){if(!(G.paused&&!NET.on))update(dt);netTick(dt)}
 else if(G.state==='menu'||G.state==='lobby'){const t=performance.now()/1000;camera.position.set(Math.sin(t*.08)*16,6+Math.sin(t*.2),Math.cos(t*.08)*16);camera.lookAt(0,1.5,0);fxUpdate(dt);for(const c of menuZ)updChar(c,dt)}
 else if(G.state==='over'){updHumans(dt);for(const z of G.zs)updChar(z.c,dt);P.c&&updChar(P.c,dt);fxUpdate(dt)}
 renderer.render(scene,camera)}
(async()=>{try{await loadAll()}catch(e){console.error(e)}
 if(!ANIMS||!ANIMS.length||!HUMANS.some(h=>MODELS[h.id])){$('loadT').innerHTML='素材载入失败（'+FAILS.length+' 个文件）<br><span style="font-size:13px;opacity:.75">请检查网络，或用浏览器（Chrome）直接打开本页面</span><br><button class="btn" onclick="location.reload()" style="margin-top:12px">重新载入</button>';return}
 if(!MODELS[HUMANS[skinI].id])skinI=Math.max(0,HUMANS.findIndex(h=>MODELS[h.id]));
 buildMap();$('load').classList.add('hid');G.state='menu';
 for(let i=0;i<5;i++){const t=ZT.walker;const m=pick(t.m.filter(n=>MODELS[n]));if(!m)break;const c=makeChar(m,'z_',1.78,.9);c.wrap.position.set(rand(-8,8),0,rand(-8,8));c.wrap.rotation.y=rand(0,6);setBase(c,'idle',1);scene.add(c.wrap);menuZ.push(c)}
 showMenu();
 const qr=new URLSearchParams(location.search).get('room');if(qr){$('code').value=qr.toUpperCase();menuMsg('已收到邀请：填好名字后点「加入房间」')}
 loop();window.__G=G;window.__P=P;window.__NET=NET;window.__HUM=HUM})();
</script>
