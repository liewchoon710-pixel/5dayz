const TER={g:{n:'平原',mv:1,df:1,e:4},f:{n:'树林',mv:1.5,df:0.8,e:1},h:{n:'丘陵',mv:1.5,df:0.8,e:0},m:{n:'山',mv:0,df:1},w:{n:'河湖',mv:0,df:1},p:{n:'田',mv:1,df:1,e:4}};
const SP={core:{n:'中央核心',inc:[0,0,0,0.5,0],vis:5,need:3,d:'火 +30/分，视野 5 格'},mine:{n:'铁矿',inc:[0.4,0,0,0,0],vis:2,need:3,d:'金 +24/分'},fort:{n:'关隘',inc:[0,0,0,0.3,0.15],vis:4,need:3,d:'火 +18/分、土 +9/分，视野 4 格，站在这里受到伤害 −25%'}};
const POP=30,BLD_HP=450;

/* ================= 状态 ================= */
let G=null,ME=0,HEADLESS=false,RNG=Math.random;const rnd=()=>RNG();
let UAT={},BAT={};
function T(q,r){return G.tiles[key(q,r)];}
function unitAt(q,r){const id=UAT[key(q,r)];return id?G.units[id]:null;}
function bldAt(q,r){const id=BAT[key(q,r)];return id?G.blds[id]:null;}
function nbrs(q,r){const o=[];for(const[a,b] of DIRS){const t=T(q+a,r+b);if(t)o.push(t);}return o;}
function ring(q,r,R){const o=[];for(let a=-R;a<=R;a++)for(let b=Math.max(-R,-a-R);b<=Math.min(R,-a+R);b++){const t=T(q+a,r+b);if(t)o.push(t);}return o;}
const P=o=>G.pl[o];const raceOf=o=>RACE[G.pl[o].race];const colOf=o=>o<0?'#888':raceOf(o).col;
const enemy=(a,b)=>a>=0&&b>=0&&a!==b&&G.pl[a].team!==G.pl[b].team;
function unitsOf(o){const r=[];for(const id in G.units){const u=G.units[id];if(u.o===o)r.push(u);}return r;}
function bldsOf(o,k){const r=[];for(const id in G.blds){const b=G.blds[id];if(b.o===o&&(!k||b.k===k))r.push(b);}return r;}
function capOf(o){return bldsOf(o,'cap')[0];}
function passT(t,fly){return t&&(fly||t.t!=='m'&&t.t!=='w');}

/* 地图 */
const R0=9;
function genMap(seed){for(let tries=0;tries<40;tries++){const rr=mulberry(seed+tries*977);const tiles={};
  const noise=[];for(let i=0;i<8;i++)noise.push([rr()*6.28,0.35+rr()*0.5,rr()*6.28,rr()]);
  const nv=(x,y,s)=>{let v=0;for(const[a,f,p,w] of noise)v+=Math.sin((x*Math.cos(a)+y*Math.sin(a))*f*s+p)*(0.5+w);return v/noise.length;};
  for(let q=-R0;q<=R0;q++)for(let r=Math.max(-R0,-q-R0);r<=Math.min(R0,-q+R0);r++){if(tiles[key(q,r)])continue;const[x,y]=hx(q,r);
    const a=nv(x,y,0.55),b=nv(x+40,y-17,0.8),c=nv(x-9,y+33,1.1);let t='g';
    if(a>0.42)t='m';else if(b>0.5)t='w';else if(c>0.28)t='f';else if(a>0.22)t='h';else if(c<-0.45)t='p';
    const s=Math.floor(rr()*1e9);tiles[key(q,r)]={q,r,t,seed:s,own:-1};tiles[key(-q,-r)]={q:-q,r:-r,t,seed:s+7,own:-1};}
  const caps=[[0,-7],[0,7]];const sps=[[0,0,'core'],[-4,2,'mine'],[4,-2,'mine'],[-8,4,'fort'],[8,-4,'fort']];
  for(const[q,r] of caps)for(let a=-2;a<=2;a++)for(let b=-2;b<=2;b++){const t=tiles[key(q+a,r+b)];if(t&&hexDist(q,r,q+a,r+b)<=2&&(t.t==='m'||t.t==='w'))t.t=hexDist(q,r,q+a,r+b)<=1?'g':(rr()<0.5?'g':'f');}
  for(const[q,r,k] of sps){const t=tiles[key(q,r)];t.t='g';t.sp=k;for(const[a,b] of DIRS){const n=tiles[key(q+a,r+b)];if(n&&(n.t==='m'||n.t==='w'))n.t='h';}}
  // 连通性
  const pass=t=>t&&t.t!=='m'&&t.t!=='w';const st=[tiles[key(0,-7)]];const seen=new Set([key(0,-7)]);
  while(st.length){const t=st.pop();for(const[a,b] of DIRS){const n=tiles[key(t.q+a,t.r+b)];const k=key(t.q+a,t.r+b);if(pass(n)&&!seen.has(k)){seen.add(k);st.push(n);}}}
  if(!seen.has(key(0,7))||![...sps].every(([q,r])=>seen.has(key(q,r))))continue;
  const blocked=Object.values(tiles).filter(t=>!pass(t)).length;if(blocked>Object.keys(tiles).length*0.24)continue;
  // 封闭的小块变成丘陵
  for(const t of Object.values(tiles))if(pass(t)&&!seen.has(key(t.q,t.r)))t.t='m';
  return {tiles,caps};}
  throw new Error('map');}


function newGame(opt){const seed=opt.seed||Math.floor(Math.random()*1e9);RNG=mulberry(seed^0x9e3779b9);const m=genMap(seed);
  G={t:0,seed,tiles:m.tiles,units:{},blds:{},uid:1,bid:1,pl:[],over:null,diff:opt.diff??1};UAT={};BAT={};
  m.caps.forEach(([q,r],i)=>{G.pl.push({race:opt.races[i],ai:i!==opt.me,team:i,mat:[14,14,14,14,14],rare:[0,0,0],inc:[0,0,0,0,0],catch:1,land:0,cd:{},buff:0,dead:false,stats:{kill:0,lost:0,made:0,built:0}});
    addBld(i,'cap',q,r,{hp:4000,max:4000});
    for(const t of ring(q,r,2))if(passT(t)||hexDist(q,r,t.q,t.r)<=1)t.own=i;});
  ME=opt.me;G.vis=new Set();G.exp=new Set();updVis();calcInc();}
function addBld(o,k,q,r,x){const b=Object.assign({id:G.bid++,k,o,q,r,hp:BLD_HP,max:BLD_HP,cd:0,t:0},x||{});G.blds[b.id]=b;BAT[key(q,r)]=b.id;return b;}
function delBld(b){delete G.blds[b.id];if(BAT[key(b.q,b.r)]===b.id)delete BAT[key(b.q,b.r)];}

/* ---------- 兵营属性（叠材料） ---------- */
function brkInfo(b){const st=b.st;const lv=st.length;const extra=[0,0,0,0,0];for(let i=2;i<lv;i++)extra[st[i]]++;
  let title='';if(lv>=5){let bi=0;for(let i=1;i<5;i++)if(extra[i]>=extra[bi])bi=i;title=ELT[bi];}
  return {lv,extra,mult:1+0.15*(lv-2),title,evo:lv>=5};}
function unitStats(k,b){const U=UT[k];const hu=k.startsWith('h_')?1:0;const s={mhp:U.hp*(1+0.05*hu),atk:U.atk*(1+0.03*hu),arm:U.arm||0,regen:U.regen||0,slow:U.slow?1:0,burn:U.burn||0,big:U.ace?1.35:1};
  if(b){const I=brkInfo(b);s.mhp*=I.mult*(1+0.15*I.extra[4]);s.atk*=I.mult;s.arm=Math.min(0.6,s.arm+0.08*I.extra[0]);s.regen+=0.01*I.extra[1];s.slow+=I.extra[2];s.burn+=1.5*I.extra[3];if(I.evo)s.big=1.2;s.title=I.title;}
  return s;}
function brkName(b){const I=brkInfo(b);return (I.title?I.title+'·':'')+UT[b.u].n;}

/* ---------- 单位 ---------- */
function addUnit(o,k,q,r,b){const S=unitStats(k,b);const u={id:G.uid++,o,k,q,r,pq:q,pr:r,mp:1,hp:S.mhp,S,cd:0,path:null,dest:null,tgt:null,still:0,burn:0,burnD:0,slowT:0,wait:0,bk:b?b.id:0,face:o===0?1:-1,first:1,rp:0,ag:0};
  G.units[u.id]=u;UAT[key(q,r)]=u.id;return u;}
function killUnit(u,by){delete G.units[u.id];if(UAT[key(u.q,u.r)]===u.id)delete UAT[key(u.q,u.r)];P(u.o).stats.lost++;
  if(by>=0){P(by).stats.kill++;if(rnd()<(UT[u.k].ace?1:0.1)){const i=Math.floor(rnd()*3);P(by).rare[i]++;if(by===ME&&!HEADLESS){feed(`缴获稀有材料「${RARE[i]}」`,'good');}}}
  if(!HEADLESS&&G.vis.has(key(u.q,u.r)))fxPush({k:'die',q:u.q,r:u.r,t:0,d:0.8});if(typeof selU!=='undefined'&&selU===u.id)selU=0;}

/* ---------- 寻路 ---------- */
function findPath(u,goalFn,hfn,strict){const fly=!!UT[u.k].fly;const sk=key(u.q,u.r);const open=[[0,u.q,u.r]];const g={[sk]:0};const from={};let n=0;
  while(open.length&&n++<700){let bi=0;for(let i=1;i<open.length;i++)if(open[i][0]<open[bi][0])bi=i;const[,q,r]=open.splice(bi,1)[0];const k=key(q,r);
    if(k!==sk&&goalFn(q,r)){const p=[];let c=k;while(c!==sk){const[a,b]=c.split(',').map(Number);p.unshift([a,b]);c=from[c];}return p;}
    for(const[a,b] of DIRS){const nq=q+a,nr=r+b,nk=key(nq,nr);const t=T(nq,nr);if(!passT(t,fly)||bldAt(nq,nr))continue;
      const ou=unitAt(nq,nr);let c=fly?1:TER[t.t].mv;if(ou&&ou!==u){if(ou.o!==u.o){if(!goalFn(nq,nr))continue;}else c+=strict?99:2.5;}
      const ng=g[k]+c;if(g[nk]===undefined||ng<g[nk]){g[nk]=ng;from[nk]=k;open.push([ng+hfn(nq,nr),nq,nr]);}}}
  return null;}
function pathTo(u,q,r,strict){return findPath(u,(a,b)=>a===q&&b===r,(a,b)=>hexDist(a,b,q,r),strict);}
function pathNear(u,q,r,R){return findPath(u,(a,b)=>hexDist(a,b,q,r)<=R&&!(unitAt(a,b)&&unitAt(a,b)!==u)&&!bldAt(a,b),(a,b)=>Math.max(0,hexDist(a,b,q,r)-R));}

/* ---------- 战斗 ---------- */
function tgtObj(tg){if(!tg)return null;if(tg.u){const u=G.units[tg.u];return u?{type:'u',o:u,owner:u.o,q:u.q,r:u.r}:null;}const b=G.blds[tg.b];return b?{type:'b',o:b,owner:b.o,q:b.q,r:b.r}:null;}
function canHit(u,tg){if(tg.type==='u'&&UT[tg.o.k].fly&&UT[u.k].rng<2&&!UT[u.k].fly)return false;return true;}
function nearWater(q,r){return nbrs(q,r).some(n=>n.t==='w');}
function atkMul(u,tg){const U=UT[u.k];let m=1;
  if(tg.type==='u'){const V=UT[tg.o.k];m*=(CTR[U.role]&&CTR[U.role][V.role])||1;if(U.antiCav&&V.role==='cav')m*=1.35;if(U.role==='sie')m*=0.5;if(U.stealth&&u.first)m*=2.5;}
  else{m*=U.role==='sie'?3:0.35;if(G.t>1200)m*=1+(G.t-1200)/300;if(tg.o.k==='cap'&&G.t<300)m*=0.5;}
  if(U.water&&nearWater(u.q,u.r))m*=1.3;
  if(P(u.o).buff>G.t)m*=1.3;
  for(const id in G.units){const a=G.units[id];if(a.o===u.o&&UT[a.k].aura&&a!==u&&hexDist(a.q,a.r,u.q,u.r)<=2){m*=1.2;break;}}
  return m;}
function defMul(tg){if(tg.type==='b')return 1;const u=tg.o;const t=T(u.q,u.r);let m=UT[u.k].fly?1:TER[t.t].df;if(t.sp==='fort')m*=0.75;return m*(1-u.S.arm);}
function doHit(u,tg){const U=UT[u.k];let dmg=u.S.atk*atkMul(u,tg)*defMul(tg)*(0.9+rnd()*0.2);u.first=0;
  applyDmg(tg,dmg,u.o);
  if(tg.type==='u'&&G.units[tg.o.id]){if(u.S.burn){tg.o.burn=3;tg.o.burnD=Math.max(tg.o.burnD,u.S.burn);tg.o.burnBy=u.o;}if(u.S.slow)tg.o.slowT=1.5+u.S.slow*0.5;}
  if(U.splash){for(const n of nbrs(tg.q,tg.r)){const v=unitAt(n.q,n.r);if(v&&enemy(u.o,v.o)&&canHit(u,{type:'u',o:v}))applyDmg({type:'u',o:v,owner:v.o,q:v.q,r:v.r},dmg*0.45,u.o);}}
  if(!HEADLESS&&(G.vis.has(key(u.q,u.r))||G.vis.has(key(tg.q,tg.r)))){const rg=U.rng>1;fxPush({k:rg?(U.role==='sie'?'stone':'arrow'):'slash',q0:u.q,r0:u.r,q:tg.q,r:tg.r,t:0,d:rg?0.45:0.25,fire:u.S.burn>0});if(rg)SFX.arrow();else SFX.hit();}}
function applyDmg(tg,dmg,by){const o=tg.o;o.hp-=dmg;o.hurt=G.t;
  if(tg.type==='u'){if(o.hp<=0)killUnit(o,by);}
  else if(o.hp<=0){if(o.k==='cap')capFall(o,by);else{delBld(o);if(by>=0){const i=Math.floor(rnd()*3);P(by).rare[i]++;if(by===ME&&!HEADLESS)feed(`拆掉敌方兵营，缴获「${RARE[i]}」`,'good');}if(o.o===ME&&!HEADLESS)feed(`我们的「${brkName(o)}」营被拆了！`,'bad');if(!HEADLESS)fxPush({k:'die',q:o.q,r:o.r,t:0,d:1});}}
  if(!HEADLESS&&G.vis.has(key(tg.q,tg.r))&&dmg>=1)fxPush({k:'num',q:tg.q,r:tg.r,txt:'-'+Math.round(dmg),t:0,d:0.8});}
function capFall(b,by){delBld(b);const o=b.o;P(o).dead=true;for(const u of unitsOf(o))killUnit(u,-1);for(const x of bldsOf(o))delBld(x);for(const t of Object.values(G.tiles))if(t.own===o)t.own=-1;
  const alive=G.pl.map((p,i)=>i).filter(i=>!P(i).dead);const teams=new Set(alive.map(i=>P(i).team));if(teams.size<=1)G.over={w:alive[0],t:G.t};
  if(!HEADLESS)feed(o===ME?'我们的主城被攻破了……':`${raceOf(o).n}的主城被我们攻破了！`,o===ME?'bad':'good');}
function inRange(u,tg){return hexDist(u.q,u.r,tg.q,tg.r)<=UT[u.k].rng;}
function seenBy(o,q,r){return o===ME?G.vis.has(key(q,r)):true;}
function bestTarget(u,R,bld){let best=null,bs=-1e9;const U=UT[u.k];
  for(const t of ring(u.q,u.r,R)){const v=unitAt(t.q,t.r);if(v&&enemy(u.o,v.o)&&canHit(u,{type:'u',o:v})){const d=hexDist(u.q,u.r,v.q,v.r);let s=-d*3+((CTR[U.role]&&CTR[U.role][UT[v.k].role])||1)*10-v.hp/40;if(U.stealth&&UT[v.k].role==='rng')s+=15;if(U.role==='sie')s-=25;if(s>bs){bs=s;best={u:v.id};}}
    if(bld!==false){const b=bldAt(t.q,t.r);if(b&&enemy(u.o,b.o)){let s=-hexDist(u.q,u.r,b.q,b.r)*3+(U.role==='sie'?30:-6)+(b.k==='brk'?3:0);if(s>bs){bs=s;best={b:b.id};}}}}
  return best;}
// 自动出击目标：先打最近的敌方兵营，没有了才打主城
function autoGoal(u){let best=null,bd=1e9;for(const id in G.blds){const b=G.blds[id];if(!enemy(u.o,b.o)||b.k!=='brk')continue;const d=hexDist(u.q,u.r,b.q,b.r);if(d<bd){bd=d;best=b;}}
  let cap=null;for(const id in G.blds){const b=G.blds[id];if(enemy(u.o,b.o)&&b.k==='cap'){cap=b;break;}}
  if(cap&&(!best||hexDist(u.q,u.r,cap.q,cap.r)+3<bd||UT[u.k].role==='sie'&&hexDist(u.q,u.r,cap.q,cap.r)<=bd+1))return cap;return best||cap;}

/* ---------- 每一步 ---------- */
function moveStep(u){const U=UT[u.k];const[nq,nr]=u.path[0];const t=T(nq,nr);const ou=unitAt(nq,nr);
  if(!passT(t,U.fly)||bldAt(nq,nr)){u.path=null;return;}
  if(ou){u.wait+=DT;if(u.wait>0.7){u.wait=0;u.path=null;if(u.dest&&hexDist(u.q,u.r,u.dest[0],u.dest[1])<=1&&ou.o===u.o){u.dest=null;u.hold=1;}}return;}
  u.wait=0;delete UAT[key(u.q,u.r)];u.pq=u.q;u.pr=u.r;u.q=nq;u.r=nr;UAT[key(nq,nr)]=u.id;u.mp=0;u.path.shift();u.face=hx(nq,nr)[0]>=hx(u.pq,u.pr)[0]?1:-1;
  if(!u.path.length)u.path=null;if(u.dest&&u.q===u.dest[0]&&u.r===u.dest[1]){u.dest=null;u.hold=1;}
  // 走过的地：中立的、或者没有敌人看守的敌方地，连着自家领土就直接插旗
  if(!U.fly&&t.own!==u.o&&!t.sp&&!bldAt(nq,nr)&&nbrs(nq,nr).some(n=>n.own===u.o)&&(t.own<0||!ring(nq,nr,1).some(n=>{const v=unitAt(n.q,n.r);return v&&enemy(u.o,v.o);}))){t.own=u.o;t.disc=0;}}
function stepUnit(u){const U=UT[u.k];if(u.cd>0)u.cd-=DT;
  if(u.burn>0){u.burn-=DT;u.hp-=u.burnD*DT;if(u.hp<=0){killUnit(u,u.burnBy);return;}if(u.burn<=0)u.burnD=0;}
  if(u.slowT>0)u.slowT-=DT;
  if(u.S.regen&&u.hp<u.S.mhp)u.hp=Math.min(u.S.mhp,u.hp+u.S.mhp*u.S.regen*DT);
  else if(u.hurt&&G.t-u.hurt>6&&T(u.q,u.r).own===u.o&&u.hp<u.S.mhp)u.hp=Math.min(u.S.mhp,u.hp+u.S.mhp*0.02*DT);
  if(u.mp<1){const t=T(u.q,u.r);let sp=U.spd*(U.fly?1:TER[t.t].mv);if(u.slowT>0)sp*=1.6;if(P(u.o).buff>G.t)sp/=1.3;u.mp+=DT/sp;if(u.mp>=1)u.mp=1;return;}
  // 治疗兵：先治疗
  if(U.heal){if(u.cd<=0){let w=null,wh=0.92;for(const t of ring(u.q,u.r,U.rng)){const v=unitAt(t.q,t.r);if(v&&v.o===u.o&&v.hp/v.S.mhp<wh){wh=v.hp/v.S.mhp;w=v;}}
      if(w){u.cd=U.cd;w.hp=Math.min(w.S.mhp,w.hp+U.heal*(u.S.atk/U.atk));if(!HEADLESS&&G.vis.has(key(w.q,w.r)))fxPush({k:'heal',q:w.q,r:w.r,t:0,d:0.6});return;}}}
  let tg=tgtObj(u.tgt);if(u.tgt&&(!tg||!canHit(u,tg))){u.tgt=null;u.path=null;tg=null;}
  if(tg&&inRange(u,tg)){if(u.cd<=0){u.cd=U.cd;doHit(u,tg);}u.face=hx(tg.q,tg.r)[0]>=hx(u.q,u.r)[0]?1:-1;return;}
  const e=bestTarget(u,U.rng);if(e){const eo=tgtObj(e);if(u.cd<=0){u.cd=U.cd;doHit(u,eo);}u.face=hx(eo.q,eo.r)[0]>=hx(u.q,u.r)[0]?1:-1;return;}
  u.ag-=DT;u.rp-=DT;
  if(u.ag<=0){u.ag=0.5+rnd()*0.3;const near=bestTarget(u,3,false);if(near){const no=tgtObj(near);if(no&&seenBy(u.o,no.q,no.r)){if(!u.tgt||u.tgt.b){u.tgt=near;u.path=null;}}}
    else if(!u.tgt||u.tgt.u){// 没有敌兵在附近：按兵营旗帜，或者自动去打敌方兵营 / 主城
      const b=G.blds[u.bk];const flag=b&&b.flag;
      if(flag){u.tgt=null;if(!u.hold||u.flagK!==key(flag[0],flag[1])){u.flagK=key(flag[0],flag[1]);if(hexDist(u.q,u.r,flag[0],flag[1])>1){u.dest=[flag[0],flag[1]];u.hold=0;}else u.hold=1;}}
      else{u.hold=0;u.dest=null;const gb=autoGoal(u);if(gb){u.tgt={b:gb.id};u.path=null;}}}}
  tg=tgtObj(u.tgt);
  if(tg){if(!u.path||u.rp<=0){u.path=pathNear(u,tg.q,tg.r,UT[u.k].rng);u.rp=1.2+rnd()*0.4;}}
  else if(u.dest&&!u.path){u.path=pathTo(u,u.dest[0],u.dest[1]);if(!u.path)u.path=pathNear(u,u.dest[0],u.dest[1],1);if(!u.path){u.dest=null;u.hold=1;}}
  if(u.path&&u.path.length)moveStep(u);
  else u.still+=DT;}
function stepBld(b){if(b.cd>0)b.cd-=DT;const p=P(b.o);
  if(b.k==='cap'){if(b.hp<b.max&&!ring(b.q,b.r,3).some(t=>{const v=unitAt(t.q,t.r);return v&&enemy(b.o,v.o);}))b.hp=Math.min(b.max,b.hp+3*DT);
    if(b.cd>0)return;let best=null,bh=1e9;for(const t of ring(b.q,b.r,2)){const v=unitAt(t.q,t.r);if(v&&enemy(b.o,v.o)&&v.hp<bh){bh=v.hp;best=v;}}
    if(best){const decay=G.t>1200?Math.max(0.4,1-(G.t-1200)/600):1;b.cd=1.2;applyDmg({type:'u',o:best,owner:best.o,q:best.q,r:best.r},18*decay*defMul({type:'u',o:best}),b.o);
      if(!HEADLESS&&(G.vis.has(key(b.q,b.r))||G.vis.has(key(best.q,best.r))))fxPush({k:'arrow',q0:b.q,r0:b.r,q:best.q,r:best.r,t:0,d:0.4});}return;}
  // 兵营：定时出兵
  if(b.k==='brk'){const U=UT[b.u];const I=brkInfo(b);const ev=U.ev*(I.evo?0.8:1);b.t+=DT;if(b.t<ev)return;
    const cap=U.swarm?4:3;let alive=0;for(const id in G.units)if(G.units[id].bk===b.id)alive++;
    if(alive>=cap||unitsOf(b.o).length>=POP){b.t=ev;return;}
    const spots=ring(b.q,b.r,2).filter(t=>passT(t,U.fly)&&!unitAt(t.q,t.r)&&!bldAt(t.q,t.r)).sort((x,y)=>hexDist(x.q,x.r,b.q,b.r)-hexDist(y.q,y.r,b.q,b.r));
    if(!spots.length)return;b.t=0;const n=U.swarm?2:1;for(let i=0;i<n&&i<spots.length&&alive+i<cap;i++){addUnit(b.o,b.u,spots[i].q,spots[i].r,b);p.stats.made++;}}}
function calcInc(){const land=G.pl.map(()=>0);for(const t of Object.values(G.tiles))if(t.own>=0&&passT(t))land[t.own]++;
  G.pl.forEach((p,o)=>{if(p.dead){p.inc=[0,0,0,0,0];return;}const inc=[0.12,0.12,0.15,0.15,0.1];
    for(const t of Object.values(G.tiles)){if(t.own!==o||!passT(t))continue;const e=TER[t.t].e;if(e!==undefined)inc[e]+=e===4?0.018:0.045;if(nearWater(t.q,t.r))inc[2]+=0.035;if(t.sp)SP[t.sp].inc.forEach((v,i)=>inc[i]+=v);}
    const mx=Math.max(1,...land.filter((_,i)=>i!==o&&enemy(o,i)));p.catch=land[o]<mx*0.5?1.4:land[o]<mx*0.75?1.2:1;
    let m=p.catch*(p.ai?[0.8,1,1.2][G.diff]:1);p.inc=inc.map(v=>v*m);p.land=land[o];});}
function maxBrk(o){return Math.min(8,2+Math.floor((P(o).land||0)/10));}
function stepCapture(){for(const u of Object.values(G.units)){if(u.mp<1||u.path)continue;const t=T(u.q,u.r);if(!t.sp||t.own===u.o)continue;
    if(ring(t.q,t.r,1).some(n=>{const v=unitAt(n.q,n.r);return v&&enemy(u.o,v.o);}))continue;
    if(!t.cap||t.cap.o!==u.o)t.cap={o:u.o,p:0};t.cap.p+=0.5;
    if(t.cap.p>=SP[t.sp].need){const was=t.own;t.own=u.o;t.cap=null;t.disc=0;if(!HEADLESS){if(u.o===ME){feed(`占领了${SP[t.sp].n}：${SP[t.sp].d}`,'good');SFX.cap();}else if(was===ME)feed(`我们的${SP[t.sp].n}被抢走了！`,'bad');}}}
  for(const t of Object.values(G.tiles))if(t.cap&&!(unitAt(t.q,t.r)&&unitAt(t.q,t.r).o===t.cap.o))t.cap=null;}
function stepConnect(){G.pl.forEach((p,o)=>{if(p.dead)return;const cap=capOf(o);if(!cap)return;const seen=new Set([key(cap.q,cap.r)]);const st=[T(cap.q,cap.r)];
  while(st.length){const t=st.pop();for(const n of nbrs(t.q,t.r)){const k=key(n.q,n.r);if(n.own===o&&!seen.has(k)){seen.add(k);st.push(n);}}}
  for(const t of Object.values(G.tiles)){if(t.own!==o)continue;if(seen.has(key(t.q,t.r)))t.disc=0;else{t.disc=(t.disc||0)+2;if(t.disc>=6){t.own=-1;t.disc=0;const b=bldAt(t.q,t.r);if(b&&b.k==='brk'&&b.o===o){b.hp-=b.max*0.25;}}}}});}
function updVis(){const v=new Set();const add=(q,r,R)=>{for(const t of ring(q,r,R))v.add(key(t.q,t.r));};
  for(const u of Object.values(G.units))if(u.o===ME||!enemy(ME,u.o))add(u.q,u.r,UT[u.k].fly?4:3);
  for(const b of Object.values(G.blds))if(b.o===ME||!enemy(ME,b.o))add(b.q,b.r,b.k==='cap'?4:3);
  for(const t of Object.values(G.tiles))if(t.own===ME||(t.own>=0&&!enemy(ME,t.own)))add(t.q,t.r,t.sp?SP[t.sp].vis:1);
  if(G.over)for(const k in G.tiles)v.add(k);G.vis=v;for(const k of v)G.exp.add(k);}
let accCap=0,accCon=0,accInc=0,accVis=0,accAI=0;
function tick(){if(G.over)return;G.t+=DT;
  for(const p of G.pl)if(!p.dead)for(let i=0;i<5;i++)p.mat[i]+=p.inc[i]*DT;
  for(const b of Object.values(G.blds))if(G.blds[b.id])stepBld(b);
  for(const u of Object.values(G.units))if(G.units[u.id])stepUnit(u);
  accCap+=DT;if(accCap>=0.5){accCap=0;stepCapture();}
  accCon+=DT;if(accCon>=2){accCon=0;stepConnect();}
  accInc+=DT;if(accInc>=1){accInc=0;calcInc();}
  accVis+=DT;if(accVis>=0.3&&!HEADLESS){accVis=0;updVis();}
  accAI+=DT;if(accAI>=1){accAI=0;G.pl.forEach((p,o)=>{if(p.ai&&!p.dead)aiTick(o);});}
  if(!HEADLESS&&Math.floor(G.t)===1200&&Math.floor(G.t-DT)===1199)feed('二十分钟过去了：各家的城墙开始衰退，主城越来越难守！','bad');}

/* ---------- 指令（玩家和电脑都走这里，以后联机也一样） ---------- */
function buildCost(a,b){const c=[0,0,0,0,0];if(a===b)c[a]=12;else{c[a]+=7;c[b]+=7;}return c;}
function stackCost(b,e){const lv=b.st.length;const c=[0,0,0,0,0];c[e]=lv>=4?12:8;return {mat:c,rare:lv>=4?1:0};}
function canPay(p,c){return c.every((v,i)=>p.mat[i]>=v);}
function pay(p,c){c.forEach((v,i)=>p.mat[i]-=v);}
function brkSpotOK(o,q,r){const t=T(q,r);return t&&t.own===o&&passT(t)&&!t.sp&&!bldAt(q,r)&&!unitAt(q,r)&&!t.disc;}
function cmd(c){const o=c.o;const p=P(o);if(!p||p.dead||G.over)return false;
  switch(c.t){
   case 'build':{if(!brkSpotOK(o,c.q,c.r)||bldsOf(o,'brk').length>=maxBrk(o))return false;const k=REC[raceOf(o).k][recKey(c.a,c.b)];if(!k)return false;const cost=buildCost(c.a,c.b);if(!canPay(p,cost))return false;
     pay(p,cost);const b=addBld(o,'brk',c.q,c.r,{u:k,st:[c.a,c.b],t:UT[k].ev*0.6,flag:null});p.stats.built++;if(o===ME&&!HEADLESS){SFX.build();bookAdd(k);}return b.id;}
   case 'stack':{const b=G.blds[c.b];if(!b||b.o!==o||b.k!=='brk'||b.st.length>=5)return false;const sc=stackCost(b,c.e);if(!canPay(p,sc.mat))return false;
     let ri=-1;if(sc.rare){ri=[0,1,2].sort((x,y)=>p.rare[y]-p.rare[x])[0];if(p.rare[ri]<1)return false;}pay(p,sc.mat);if(ri>=0)p.rare[ri]--;b.st.push(c.e);const hpR=b.hp/b.max;b.max=Math.round(BLD_HP*(1+0.12*(b.st.length-2)));b.hp=b.max*hpR;
     if(o===ME&&!HEADLESS){SFX.era();if(b.st.length>=5)feed(`兵营进化了：「${brkName(b)}」！`,'good');}return true;}
   case 'flag':{const b=G.blds[c.b];if(!b||b.o!==o||b.k!=='brk')return false;b.flag=c.q===undefined?null:[c.q,c.r];for(const id in G.units){const u=G.units[id];if(u.bk===b.id){u.hold=0;u.dest=null;u.tgt=null;u.path=null;u.ag=0;}}return true;}
   case 'demolish':{const b=G.blds[c.b];if(!b||b.o!==o||b.k!=='brk')return false;const cost=buildCost(b.st[0],b.st[1]);cost.forEach((v,i)=>p.mat[i]+=Math.floor(v/2));delBld(b);return true;}
   case 'skill':{const S=SKILL[c.k];if(!S||!raceOf(o).sk||!raceOf(o).sk.includes(c.k))return false;if((p.cd[c.k]||0)>G.t||p.mat[S.e]<S.cost)return false;
     if(S.tgt==='area'){const t=T(c.q,c.r);if(!t)return false;}p.mat[S.e]-=S.cost;p.cd[c.k]=G.t+S.cd;doSkill(o,c.k,c.q,c.r);return true;}
   case 'ace':{const R=raceOf(o);if(!R.ace||p.rare.some(v=>v<1)||Object.values(G.units).some(u=>u.o===o&&u.k===R.ace))return false;const cap=capOf(o);const sp=ring(cap.q,cap.r,2).find(t=>passT(t,UT[R.ace].fly)&&!unitAt(t.q,t.r)&&!bldAt(t.q,t.r));if(!sp)return false;
     p.rare=p.rare.map(v=>v-1);addUnit(o,R.ace,sp.q,sp.r,null);if(!HEADLESS)feed(o===ME?`王牌「${UT[R.ace].n}」出阵！`:`敌方王牌「${UT[R.ace].n}」出阵了！`,o===ME?'good':'bad');return true;}
  }return false;}
function doSkill(o,k,q,r){const vis=!HEADLESS;
  if(k==='huogong'||k==='shihun'){for(const t of ring(q,r,1)){const v=unitAt(t.q,t.r);if(v&&enemy(o,v.o)){applyDmg({type:'u',o:v,owner:v.o,q:v.q,r:v.r},k==='huogong'?40:30,o);if(G.units[v.id]&&k==='huogong'){v.burn=4;v.burnD=4;v.burnBy=o;}}
      if(k==='shihun'&&v&&v.o===o&&G.units[v.id])v.hp=Math.min(v.S.mhp,v.hp+30);if(vis)fxPush({k:k==='huogong'?'fire':'soul',q:t.q,r:t.r,t:0,d:1.2});}}
  else if(k==='yuanjun'){let best=null,bd=1e9;for(const b of bldsOf(o)){const d=hexDist(b.q,b.r,q??b.q,r??b.r);if(d<bd){bd=d;best=b;}}if(!best)return;
    const spots=ring(best.q,best.r,2).filter(t=>passT(t)&&!unitAt(t.q,t.r)&&!bldAt(t.q,t.r));for(let i=0;i<3&&i<spots.length;i++){const u=addUnit(o,'h_mil',spots[i].q,spots[i].r,null);if(vis)fxPush({k:'tap',q:u.q,r:u.r,t:0,d:0.8});}}
  else if(k==='shouchao'){P(o).buff=G.t+10;}
  if(vis&&o===ME)SFX.era();}

/* ---------- 电脑 ---------- */
const ROLE_ELEM={inf:[0,4],rng:[3,1],cav:[3,0],sie:[4,0],sup:[1,4]};
function aiTick(o){const p=P(o);const R=raceOf(o);const rk=R.k;const ai=p.aiS||(p.aiS={flagT:0,next:0});const cap=capOf(o);if(!cap)return;
  const my=unitsOf(o);const brks=bldsOf(o,'brk');const foes=Object.values(G.units).filter(u=>enemy(o,u.o));
  // 王牌
  if(p.rare.every(v=>v>=1))cmd({t:'ace',o});
  // 盖兵营
  if(brks.length<maxBrk(o)&&G.t>=ai.next){const roleN={inf:0,rng:0,cav:0,sie:0,sup:0};for(const b of brks)roleN[UT[b.u].role]++;
    const fr={inf:0,rng:0,cav:0,sie:0,sup:0};for(const u of foes)fr[UT[u.k].role]++;
    const w={inf:3+fr.cav*0.4,rng:3+fr.inf*0.4,cav:2+fr.rng*0.4+fr.sie*0.3,sie:(G.t>200?2:0.3)+(brks.length>=3?1:0),sup:brks.length>=3?1.2:0};
    for(const k in w)w[k]/=(1+roleN[k]*0.9);
    const opts=[];for(const rkey in REC[rk]){const[a,b]=rkey.split(',').map(Number);const uk=REC[rk][rkey];const cost=buildCost(a,b);if(!canPay(p,cost))continue;opts.push({a,b,uk,s:w[UT[uk].role]*(0.6+rnd()*0.8)});}
    opts.sort((x,y)=>y.s-x.s);
    if(opts.length){const spot=aiSpot(o);if(spot){cmd({t:'build',o,a:opts[0].a,b:opts[0].b,q:spot.q,r:spot.r});ai.next=G.t+4+rnd()*6;}}}
  // 叠材料：材料多的时候往兵营里叠
  for(let i=0;i<5;i++){if(p.mat[i]<26)continue;const cand=brks.filter(b=>b.st.length<5&&(b.st.length<4||p.rare.some(v=>v>=1)&&!p.rare.every(v=>v>=1)));if(!cand.length)break;
    const pref=cand.filter(b=>ROLE_ELEM[UT[b.u].role].includes(i));const b=(pref.length?pref:cand).sort((x,y)=>x.st.length-y.st.length)[0];cmd({t:'stack',o,b:b.id,e:i});}
  // 计谋
  for(const sk of R.sk||[]){const S=SKILL[sk];if((p.cd[sk]||0)>G.t||p.mat[S.e]<S.cost+4)continue;
    if(S.tgt==='area'){let best=null,bn=2;for(const f of foes){const n=ring(f.q,f.r,1).filter(t=>{const v=unitAt(t.q,t.r);return v&&enemy(o,v.o);}).length;if(n>bn&&my.some(u=>hexDist(u.q,u.r,f.q,f.r)<=4)){bn=n;best=f;}}if(best&&rnd()<0.5)cmd({t:'skill',o,k:sk,q:best.q,r:best.r});}
    else if(sk==='yuanjun'){const th=foes.filter(f=>bldsOf(o).some(b=>hexDist(b.q,b.r,f.q,f.r)<=3));if(th.length>=2)cmd({t:'skill',o,k:sk,q:th[0].q,r:th[0].r});}
    else if(sk==='shouchao'){const fighting=my.filter(u=>foes.some(f=>hexDist(f.q,f.r,u.q,u.r)<=2)).length;if(fighting>=5)cmd({t:'skill',o,k:sk});}}
  // 插旗抢据点：派一座兵营去抢最近的没占的据点
  const sps=Object.values(G.tiles).filter(t=>t.sp&&t.own!==o).sort((a,b)=>hexDist(a.q,a.r,cap.q,cap.r)-hexDist(b.q,b.r,cap.q,cap.r));
  for(const b of brks)if(b.flag){const t=T(b.flag[0],b.flag[1]);if(!t||t.own===o||G.t-(b.flagT||0)>90)cmd({t:'flag',o,b:b.id});}
  if(sps.length&&brks.length>=2&&!brks.some(b=>b.flag)&&G.t>ai.flagT){const fast=brks.filter(b=>['cav','inf'].includes(UT[b.u].role)).sort((x,y)=>hexDist(x.q,x.r,sps[0].q,sps[0].r)-hexDist(y.q,y.r,sps[0].q,sps[0].r))[0];
    if(fast){cmd({t:'flag',o,b:fast.id,q:sps[0].q,r:sps[0].r});fast.flagT=G.t;ai.flagT=G.t+40;}}}
function aiSpot(o){const ecap=Object.values(G.blds).find(b=>b.k==='cap'&&enemy(o,b.o));const cap=capOf(o);let best=null,bs=-1e9;
  for(const t of Object.values(G.tiles)){if(!brkSpotOK(o,t.q,t.r))continue;const inner=nbrs(t.q,t.r).filter(n=>n.own===o).length;if(inner<3)continue;
    if(nbrs(t.q,t.r).some(n=>{const b=bldAt(n.q,n.r);return b&&b.k==='brk';}))continue;const s=-(ecap?hexDist(t.q,t.r,ecap.q,ecap.r):0)*0.7-hexDist(t.q,t.r,cap.q,cap.r)*0.3+rnd()*2;if(s>bs){bs=s;best=t;}}
  return best;}

/* ---------- 图鉴 ---------- */
function bookGet(){try{return new Set(JSON.parse(localStorage.getItem('pc-book')||'[]'));}catch(e){return new Set();}}
function bookAdd(k){const s=bookGet();if(!s.has(k)){s.add(k);try{localStorage.setItem('pc-book',JSON.stringify([...s]));}catch(e){}feed(`发现新配方：「${UT[k].n}」——${UT[k].d}`,'good');}}
// 测试用：电脑对电脑
function simGame(seed,ra,rb,maxT){HEADLESS=true;newGame({seed,races:[ra,rb],me:-1,diff:1});G.pl.forEach(p=>p.ai=true);ME=0;while(!G.over&&G.t<(maxT||2400))tick();HEADLESS=false;
  return{w:G.over?G.over.w:-1,t:Math.round(G.t),land:G.pl.map(p=>p.land),made:G.pl.map(p=>p.stats.made),built:G.pl.map(p=>p.stats.built),lv:G.pl.map((p,o)=>bldsOf(o,'brk').map(b=>b.st.length).join(''))};}

/* 美术 */
function hx2rgb(h){const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255];}
function mixc(a,b,t){const A=hx2rgb(a),B=hx2rgb(b);return`rgb(${Math.round(A[0]+(B[0]-A[0])*t)},${Math.round(A[1]+(B[1]-A[1])*t)},${Math.round(A[2]+(B[2]-A[2])*t)})`;}
const lite=(c,t)=>mixc(c,'#ffffff',t),dark=(c,t)=>mixc(c,'#1e1a16',t);const OUT='rgba(45,35,28,.55)';
function vtx(k,Z){const a=Math.PI/3*k;return[Z*Math.cos(a),Z*Math.sin(a)*SQ];}
function hexPath(c,Z){c.beginPath();for(let k=0;k<6;k++){const[x,y]=vtx(k,Z);k?c.lineTo(x,y):c.moveTo(x,y);}c.closePath();}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function box3(c,x,y,w,d,h,col,opt){opt=opt||{};const dx=d*0.55,dy=d*0.38;
  c.fillStyle=dark(col,0.28);c.beginPath();c.moveTo(x+w/2,y);c.lineTo(x+w/2,y-h);c.lineTo(x+w/2+dx,y-h-dy);c.lineTo(x+w/2+dx,y-dy);c.closePath();c.fill();
  const g=c.createLinearGradient(0,y-h,0,y);g.addColorStop(0,lite(col,0.06));g.addColorStop(1,dark(col,0.1));c.fillStyle=g;c.fillRect(x-w/2,y-h,w,h);
  if(!opt.noTop){c.fillStyle=lite(col,0.22);c.beginPath();c.moveTo(x-w/2,y-h);c.lineTo(x+w/2,y-h);c.lineTo(x+w/2+dx,y-h-dy);c.lineTo(x-w/2+dx,y-h-dy);c.closePath();c.fill();}
  if(opt.line!==false){c.strokeStyle=OUT;c.lineWidth=Math.max(0.6,w*0.025);c.beginPath();c.moveTo(x-w/2,y-h);c.lineTo(x-w/2,y);c.lineTo(x+w/2,y);c.lineTo(x+w/2+dx,y-dy);c.lineTo(x+w/2+dx,y-h-dy);if(!opt.noTop)c.lineTo(x-w/2+dx,y-h-dy);c.lineTo(x-w/2,y-h);c.stroke();}}
// 中式飞檐屋顶
function eave(c,x,y,w,d,rh,col){const dx=d*0.55,dy=d*0.38,e=w*0.16;
  const L=[x-w/2-e,y],Rr=[x+w/2+e,y],BL=[x-w/2-e+dx,y-dy],BR=[x+w/2+e+dx,y-dy],TL=[x-w/2+dx*0.5+w*0.12,y-dy*0.5-rh],TR=[x+w/2+dx*0.5-w*0.12,y-dy*0.5-rh];
  c.fillStyle=dark(col,0.3);c.beginPath();c.moveTo(Rr[0],Rr[1]);c.quadraticCurveTo(Rr[0]-e*0.3,Rr[1]-rh*0.35,TR[0],TR[1]);c.lineTo(BR[0],BR[1]-rh*0.1);c.closePath();c.fill();
  const g=c.createLinearGradient(0,TL[1],0,L[1]);g.addColorStop(0,lite(col,0.18));g.addColorStop(1,dark(col,0.12));c.fillStyle=g;

function tutStart(){TUT={off:!tutPref(),did:{},shown:{}};if(TUT.off){paused=false;return;}paused=true;TUT.i=0;tutCard();}
function tutCard(){const cs=tutCards();const i=TUT.i;$('#tutC').innerHTML=`<div class="tdots">${cs.map((_,j)=>`<i style="${j===i?'background:'+raceOf(ME).col:''}"></i>`).join('')}</div>${cs[i]}<label class="tchk"><input type="checkbox" id="tNo" ${tutPref()?'':'checked'}> 以后开局不再显示（主菜单可以重新打开）</label><div class="acts2">${i?'<button class="b" id="tPrev">上一张</button>':'<button class="b" id="tSkip">跳过教学</button>'}<button class="b main" id="tNext">${i<cs.length-1?'下一张':'开战！'}</button></div>`;
  $('#ovTut').hidden=false;$('#tNo').onchange=e=>tutSet(!e.target.checked);const close=coach=>{$('#ovTut').hidden=true;paused=false;if(!coach)TUT.off=true;};
  if($('#tPrev'))$('#tPrev').onclick=()=>{TUT.i--;tutCard();};if($('#tSkip'))$('#tSkip').onclick=()=>close(false);$('#tNext').onclick=()=>{if(TUT.i<cs.length-1){TUT.i++;tutCard();}else close(tutPref());};}
const COACH=[{id:'build',txt:'点下面的「盖兵营」，再点一格亮着的地，选两种材料。'},{id:'wait',txt:'兵营会自己出兵、自己去打。趁这时候再多盖几座不同的兵营，搭配近战、远程、骑兵。',done:()=>bldsOf(ME,'brk').length>=3},{id:'flag',txt:'试试插旗：点一座兵营 →「插旗」→ 点中间的「中央核心」，派兵去抢（火 +30/分）。',av:()=>bldsOf(ME,'brk').length>=2},{id:'stack',txt:'材料多了就点兵营「叠材料」，兵会变强；叠满 5 份会进化。',av:()=>P(ME).mat.some(v=>v>=20)},{id:'skill',txt:'敌人一群冲过来时，用下面的计谋（火攻 / 噬魂…）点在他们中间。',av:()=>G.t>180}];
function coachDid(k){if(TUT)TUT.did[k]=1;}
function coachTick(){const el=$('#coach');if(!G||TUT.off||G.over||!$('#ovTut').hidden||!$('#sheet').hidden){el.hidden=true;return;}let st=null;for(const c of COACH){if(TUT.shown[c.id]==='x')continue;if(TUT.did[c.id]||c.done&&c.done()){TUT.shown[c.id]='x';continue;}if(!c.av||c.av()){st=c;break;}}
  if(!st){el.hidden=true;return;}if(el._id!==st.id){el._id=st.id;el.innerHTML=`<div style="font-size:11px;font-weight:700;color:var(--ac)">新手提示</div>${st.txt}<div class="cb"><button id="cOff">关掉提示</button><button class="k" id="cOk">知道了</button></div>`;$('#cOk').onclick=()=>{TUT.shown[st.id]='x';el._id=null;};$('#cOff').onclick=()=>{TUT.off=true;};}el.hidden=false;}

/* ================= 菜单 / 结束 ================= */
let myR=0,diff=1;try{myR=+(localStorage.getItem('pc-race')||0)||0;if(!RACE[myR]||!RACE[myR].ok)myR=0;}catch(e){}
function drawRaces(){$('#facPick').innerHTML=RACE.map((f,i)=>`<div class="fc ${i===myR?'on':''} ${f.ok?'':'off'}" data-f="${i}"><div class="big" style="color:${f.col}">${f.n[0]}</div><div class="s">${f.n}${f.ok?'':'<br>即将推出'}</div></div>`).join('');const f=RACE[myR];
  $('#facInfo').innerHTML=`<b style="color:${f.col}">${f.n}</b>：${f.lore}<br>计谋：${f.sk.map(k=>SKILL[k].n).join('、')} · 王牌：${UT[f.ace].n}`;
  $('#facPick').querySelectorAll('.fc').forEach(el=>el.onclick=()=>{const i=+el.dataset.f;if(!RACE[i].ok){tip(`${RACE[i].n}还在做：${RACE[i].lore}`);return;}myR=i;try{localStorage.setItem('pc-race',myR);}catch(e){}drawRaces();});}
drawRaces();$('#tutOn').checked=tutPref();$('#tutOn').onchange=e=>tutSet(e.target.checked);
$('#diffSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;diff=+b.dataset.d;$('#diffSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));};
$('#bStart').onclick=()=>{au();const foe=myR===0?1:0;const races=Math.random()<0.5?[myR,foe]:[myR,myR===0?1:0];newGame({races,me:0,diff});selU=0;selB=0;mode=null;closeSheet();$('#ovMenu').hidden=true;$('#ovEnd').hidden=true;
  const c=capOf(ME);centerOn(c.q,c.r+2);cam.z=innerWidth<600?40:50;spriteCache.clear();feed(`对手是「${raceOf(1).n}」`);tutStart();updHUD();};
function showEnd(){if(!G||!G.over)return;const w=G.over.w===ME;const p=P(ME);$('#endC').innerHTML=`<p style="font-size:52px;font-weight:900;margin:0;color:${w?'var(--good)':'var(--bad)'}">${w?'破城！':'城破了'}</p><p>${w?'敌人的主城被我们打破了。':'我们的主城被打破了。'} 用时 ${Math.floor(G.over.t/60)} 分 ${Math.floor(G.over.t%60)} 秒</p><p style="font-size:13px;color:var(--sub)">盖兵营 ${p.stats.built} · 出兵 ${p.stats.made} · 击杀 ${p.stats.kill} · 损失 ${p.stats.lost}</p><div class="acts2"><button class="b main" id="eAgain">再来一局</button></div>`;
  $('#ovEnd').hidden=false;$('#eAgain').onclick=()=>{$('#ovEnd').hidden=true;$('#ovMenu').hidden=false;};(w?SFX.win:SFX.lose)();}

/* ================= 主循环 ================= */
let last=performance.now(),acc=0,hudT=0,overShown=false;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(0.1,(now-last)/1000);last=now;gt+=dt;
  try{if(G&&!G.over&&!paused){acc+=dt;let n=0;while(acc>=DT&&n++<5){tick();acc-=DT;}}
    if(G&&G.over&&!overShown){overShown=true;updVis();setTimeout(showEnd,900);}if(G&&!G.over)overShown=false;
    render();hudT+=dt;if(G&&hudT>0.25){hudT=0;updHUD();coachTick();}}catch(e){console.error(e);}}
requestAnimationFrame(loop);

</script></body></html>
