<script>
'use strict';
const $=s=>document.querySelector(s);
const S3=Math.sqrt(3),SQ=0.62,TH=0.2,DT=0.1;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const key=(q,r)=>q+','+r;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const hexDist=(a,b,c,d)=>(Math.abs(a-c)+Math.abs(a+b-c-d)+Math.abs(b-d))/2;
const hx=(q,r)=>[1.5*q,S3*(r+q/2)];

/* ================= 数据 ================= */
const FAC=[
 {n:'玄甲',py:'xuán jiǎ',col:'#3f5f8f',hat:'helm',ace:'zb',trait:'【铁壁】刀盾原地不动 2 秒就结阵，受到的伤害 −40%；刀盾生命 +20%。',tip:'刀盾顶在前面别乱动，弓弩躲在后面输出。',lore:'北境的铁甲军。冬天比敌人更冷，所以他们从不怕冷。'},
 {n:'苍狼',py:'cāng láng',col:'#b07a32',hat:'fur',ace:'wolf',trait:'【奔袭】骑兵连续跑 2 格以上，下一击 +60%；骑兵便宜 15%、生命 +15%。',tip:'骑兵绕到侧后方冲弓弩，打完就跑。',lore:'草原上的狼骑，来的时候像风，走的时候只剩烟尘。'},
 {n:'赤霄',py:'chì xiāo',col:'#c2453a',hat:'band',ace:'bird',trait:'【火攻】弓弩命中会点燃目标，3 秒内每秒再 −2 血，烧不了城。',tip:'多造弓弩，火能把敌人慢慢烧死。',lore:'南方的火攻之家。他们说，火是最公平的：烧谁都一样。'},
 {n:'墨工',py:'mò gōng',col:'#2f8a6a',hat:'straw',ace:'golem',trait:'【机关】能在自己的地上修弩塔；第一时代就能造攻城车，攻城车便宜 15%。',tip:'用弩塔守住据点，攻城车早早去拆城。',lore:'机关术的传人。别人用人命攻城，他们用木头和齿轮。'},
];
const UT={
 dao:{n:'刀盾',ch:'刀',hp:120,atk:12,rng:1,cd:1.2,spd:1.4,cost:50,tt:6,era:1,d:'克骑兵；怕弓弩'},
 nu:{n:'弓弩',ch:'弩',hp:70,atk:10,rng:2,cd:1.4,spd:1.5,cost:55,tt:6,era:1,d:'射程 2，克刀盾、克王牌；怕骑兵'},
 qi:{n:'骑兵',ch:'骑',hp:105,atk:13,rng:1,cd:1.1,spd:0.8,cost:75,tt:8,era:1,d:'跑得快，克弓弩和攻城车；怕刀盾'},
 che:{n:'攻城车',ch:'车',hp:90,atk:32,rng:3,cd:3,spd:2.2,cost:120,tt:12,era:2,siege:1,d:'射程 3，拆城 ×3；打人很弱，怕骑兵'},
 zb:{n:'镇北侯',ch:'侯',hp:440,atk:24,rng:1,cd:1.1,spd:1.3,cost:300,tt:18,era:3,ace:1,aura:1,d:'王牌：周围友军攻击 +20%'},
 wolf:{n:'巨狼',ch:'狼',hp:380,atk:26,rng:1,cd:1.0,spd:0.7,cost:300,tt:18,era:3,ace:1,splash:1,d:'王牌：极快，攻击溅射周围敌人'},
 bird:{n:'朱雀',ch:'雀',hp:300,atk:22,rng:3,cd:1.5,spd:0.9,cost:300,tt:18,era:3,ace:1,fly:1,d:'王牌：会飞，无视地形，射程 3，点燃目标'},
 golem:{n:'木甲巨人',ch:'甲',hp:620,atk:30,rng:1,cd:1.6,spd:1.8,cost:300,tt:18,era:3,ace:1,siege:1,d:'王牌：皮厚，拆城 ×3'},
};
const CTR={dao:{qi:1.6,che:1.3,wolf:1.3},nu:{dao:1.6,zb:1.5,wolf:1.5,bird:1.5,golem:1.5},qi:{nu:1.7,che:2},che:{},zb:{},wolf:{},bird:{},golem:{}};
const TER={g:{n:'平原',mv:1,df:1},f:{n:'树林',mv:1.5,df:0.8},h:{n:'丘陵',mv:1.5,df:0.8},m:{n:'山',mv:0,df:1},w:{n:'河湖',mv:0,df:1},p:{n:'田',mv:1,df:1}};
const SP={core:{n:'中央核心',inc:3,vis:5,need:6,d:'军需 +3/秒，视野 5 格'},mine:{n:'铁矿',inc:1.5,vis:2,need:5,d:'军需 +1.5/秒'},fort:{n:'关隘',inc:1,vis:4,need:5,d:'军需 +1/秒，视野 4 格，站在这里的兵受到伤害 −25%'}};
const ERA=[null,{cost:0},{cost:260,ops:[{k:'bing',n:'兵家',d:'全军攻击 +15%'},{k:'zong',n:'纵横',d:'军需收入 +25%'}]},{cost:480,ops:[{k:'mo',n:'墨家',d:'攻城伤害 +50%，主营生命 +30%，所有人能修弩塔'},{k:'jiang',n:'名将',d:'王牌半价，全军生命 +15%'}]}];
const POPCAP=[0,10,14,18];
const TOWER={n:'弩塔',hp:300,atk:9,rng:2,cd:1.3,cost:90};

/* ================= 状态 ================= */
let G=null,ME=0,HEADLESS=false,RNG=Math.random;const rnd=()=>RNG();
let UAT={};// key->unit id
function T(q,r){return G.tiles[key(q,r)];}
function unitAt(q,r){const id=UAT[key(q,r)];return id?G.units[id]:null;}
function bldAt(q,r){for(const b of Object.values(G.blds))if(b.q===q&&b.r===r)return b;return null;}
function nbrs(q,r){const o=[];for(const[a,b] of DIRS){const t=T(q+a,r+b);if(t)o.push(t);}return o;}
function ring(q,r,R){const o=[];for(let a=-R;a<=R;a++)for(let b=Math.max(-R,-a-R);b<=Math.min(R,-a+R);b++){const t=T(q+a,r+b);if(t)o.push(t);}return o;}
const P=o=>G.pl[o];const fac=o=>G.pl[o].f;const colOf=o=>o<0?'#888':FAC[fac(o)].col;
const enemy=(a,b)=>a>=0&&b>=0&&a!==b&&G.pl[a].team!==G.pl[b].team;
function unitsOf(o){return Object.values(G.units).filter(u=>u.o===o);}

/* ================= 地图 ================= */
const R0=9;
function genMap(seed){for(let tries=0;tries<40;tries++){const rr=mulberry(seed+tries*977);const tiles={};
  const noise=[];for(let i=0;i<8;i++)noise.push([rr()*6.28,0.35+rr()*0.5,rr()*6.28,rr()]);
  const nv=(x,y,s)=>{let v=0;for(const[a,f,p,w] of noise)v+=Math.sin((x*Math.cos(a)+y*Math.sin(a))*f*s+p)*(0.5+w);return v/noise.length;};
  for(let q=-R0;q<=R0;q++)for(let r=Math.max(-R0,-q-R0);r<=Math.min(R0,-q+R0);r++){if(tiles[key(q,r)])continue;const[x,y]=hx(q,r);
    const a=nv(x,y,0.55),b=nv(x+40,y-17,0.8),c=nv(x-9,y+33,1.1);let t='g';
    if(a>0.42)t='m';else if(b>0.5)t='w';else if(c>0.28)t='f';else if(a>0.22)t='h';else if(c<-0.45)t='p';
    const s=Math.floor(rr()*1e9);tiles[key(q,r)]={q,r,t,seed:s,own:-1};tiles[key(-q,-r)]={q:-q,r:-r,t,seed:s+7,own:-1};}
  const caps=[[0,-7],[0,7]];const sps=[[0,0,'core'],[-4,2,'mine'],[4,-2,'mine'],[-8,4,'fort'],[8,-4,'fort']];
  for(const[q,r] of caps)for(let a=-2;a<=2;a++)for(let b=-2;b<=2;b++){const t=tiles[key(q+a,r+b)];if(t&&hexDist(q,r,q+a,r+b)<=2&&(t.t==='m'||t.t==='w'))t.t=hexDist(q,r,q+a,r+b)<=1?'g':(rr()<0.5?'g':'f');}
  for(const[q,r,k] of sps){const t=tiles[key(q,r)];t.t='g';t.sp=k;for(const[a,b] of DIRS){const n=tiles[key(q+a,r+b)];if(n&&(n.t==='m'||n.t==='w'))n.t='h';}}
  // 连通性
  const pass=t=>t&&t.t!=='m'&&t.t!=='w';const st=[tiles[key(0,-7)]];const seen=new Set([key(0,-7)]);
  while(st.length){const t=st.pop();for(const[a,b] of DIRS){const n=tiles[key(t.q+a,t.r+b)];const k=key(t.q+a,t.r+b);if(pass(n)&&!seen.has(k)){seen.add(k);st.push(n);}}}
  if(!seen.has(key(0,7))||![...sps].every(([q,r])=>seen.has(key(q,r))))continue;
  const blocked=Object.values(tiles).filter(t=>!pass(t)).length;if(blocked>Object.keys(tiles).length*0.24)continue;
  // 封闭的小块变成丘陵
  for(const t of Object.values(tiles))if(pass(t)&&!seen.has(key(t.q,t.r)))t.t='m';
  return {tiles,caps};}
  throw new Error('map');}

function newGame(opt){const seed=opt.seed||Math.floor(Math.random()*1e9);RNG=mulberry(seed^0x9e3779b9);const m=genMap(seed);
  G={t:0,seed,tiles:m.tiles,units:{},blds:{},uid:1,bid:1,pl:[],over:null,fx:[],diff:opt.diff??1,acc:{}};UAT={};
  const facs=opt.facs;
  m.caps.forEach(([q,r],i)=>{G.pl.push({f:facs[i],ai:i!==opt.me,team:i,mil:120,inc:0,era:1,route:[],q:[],qp:0,seen:new Set(),catch:1,stats:{kill:0,lost:0,made:0}});
    const b={id:G.bid++,k:'cap',o:i,q,r,hp:3000,max:3000,cd:0};G.blds[b.id]=b;
    for(const t of ring(q,r,2))if(t.t!=='m'&&t.t!=='w'||hexDist(q,r,t.q,t.r)<=1)t.own=i;
    const spots=ring(q,r,2).filter(t=>hexDist(q,r,t.q,t.r)>=1&&passT(t)).sort((a,b)=>hexDist(a.q,a.r,0,0)-hexDist(b.q,b.r,0,0));
    ['dao','dao','nu','qi'].forEach((k,j)=>{if(spots[j])addUnit(i,k,spots[j].q,spots[j].r);});});
  ME=opt.me;G.vis=new Set();G.exp=new Set();updVis();calcInc();}
function passT(t,fly){return t&&(fly||t.t!=='m'&&t.t!=='w');}

/* ================= 单位 ================= */
function maxHP(o,k){let h=UT[k].hp;if(k==='dao'&&fac(o)===0)h*=1.2;if(k==='qi'&&fac(o)===1)h*=1.15;if(P(o).route.includes('jiang'))h*=1.15;return Math.round(h);}
function costOf(o,k){let c=UT[k].cost;if(k==='qi'&&fac(o)===1)c*=0.85;if(UT[k].ace&&P(o).route.includes('jiang'))c*=0.5;if(k==='che'&&fac(o)===3)c*=0.85;return Math.round(c);}
function canTrain(o,k){const U=UT[k];if(U.ace)return FAC[fac(o)].ace===k&&P(o).era>=3&&!unitsOf(o).some(u=>UT[u.k].ace)&&!P(o).q.some(x=>UT[x].ace);if(k==='che')return P(o).era>=2||fac(o)===3;return true;}
function popOf(o){return unitsOf(o).length+P(o).q.length;}
function addUnit(o,k,q,r){const u={id:G.uid++,o,k,q,r,pq:q,pr:r,mp:1,hp:maxHP(o,k),cd:0,path:null,dest:null,tgt:null,still:0,run:0,burn:0,wait:0,face:o===0?1:-1};G.units[u.id]=u;UAT[key(q,r)]=u.id;return u;}
function killUnit(u,by){delete G.units[u.id];if(UAT[key(u.q,u.r)]===u.id)delete UAT[key(u.q,u.r)];P(u.o).stats.lost++;if(by>=0)P(by).stats.kill++;
  if(!HEADLESS&&G.vis.has(key(u.q,u.r)))fxPush({k:'die',q:u.q,r:u.r,t:0,d:0.8,col:colOf(u.o)});if(sel.includes(u.id))sel=sel.filter(i=>i!==u.id);}

/* ================= 寻路 ================= */
function findPath(u,goalFn,hfn,strict){const fly=!!UT[u.k].fly;const sk=key(u.q,u.r);const open=[[0,u.q,u.r]];const g={[sk]:0};const from={};let n=0;
  while(open.length&&n++<900){let bi=0;for(let i=1;i<open.length;i++)if(open[i][0]<open[bi][0])bi=i;const[,q,r]=open.splice(bi,1)[0];const k=key(q,r);
    if(k!==sk&&goalFn(q,r)){const p=[];let c=k;while(c!==sk){const[a,b]=c.split(',').map(Number);p.unshift([a,b]);c=from[c];}return p;}
    for(const[a,b] of DIRS){const nq=q+a,nr=r+b,nk=key(nq,nr);const t=T(nq,nr);if(!passT(t,fly))continue;if(bldAt(nq,nr)&&!goalFn(nq,nr))continue;
      const ou=unitAt(nq,nr);let c=fly?1:TER[t.t].mv;if(ou&&ou!==u){if(ou.o!==u.o){if(!goalFn(nq,nr))continue;}else c+=strict?99:2.5;}
      if(bldAt(nq,nr))continue;
      const ng=g[k]+c;if(g[nk]===undefined||ng<g[nk]){g[nk]=ng;from[nk]=k;open.push([ng+hfn(nq,nr),nq,nr]);}}}
  return null;}
function pathTo(u,q,r,strict){return findPath(u,(a,b)=>a===q&&b===r,(a,b)=>hexDist(a,b,q,r),strict);}
function pathNear(u,q,r,R){return findPath(u,(a,b)=>hexDist(a,b,q,r)<=R&&!(unitAt(a,b)&&unitAt(a,b)!==u)&&!bldAt(a,b),(a,b)=>Math.max(0,hexDist(a,b,q,r)-R));}

/* ================= 战斗 ================= */
function tgtObj(tg){if(!tg)return null;if(tg.u){const u=G.units[tg.u];return u?{type:'u',o:u,owner:u.o,q:u.q,r:u.r}:null;}const b=G.blds[tg.b];return b?{type:'b',o:b,owner:b.o,q:b.q,r:b.r}:null;}
function atkMul(u,tg){const U=UT[u.k];let m=1;
  if(tg.type==='u'){m*=(CTR[u.k]&&CTR[u.k][tg.o.k])||1;if(U.siege&&!U.ace)m*=0.4;}
  else{m*=U.siege?3:0.35;if(U.siege&&P(u.o).route.includes('mo'))m*=1.5;if(tg.o.k==='cap'&&G.t>1200)m*=1+(G.t-1200)/300;}
  if(P(u.o).route.includes('bing'))m*=1.15;
  if(Object.values(G.units).some(a=>a.o===u.o&&UT[a.k].aura&&a!==u&&hexDist(a.q,a.r,u.q,u.r)<=2))m*=1.2;
  if(u.k==='qi'&&fac(u.o)===1&&u.run>=2)m*=1.6;
  // 断补给：离开自己的地超过 2 格
  if(!nearOwn(u.o,u.q,u.r,2))m*=0.8;
  return m;}
function defMul(tg){if(tg.type==='b')return 1;const u=tg.o;const t=T(u.q,u.r);let m=UT[u.k].fly?1:TER[t.t].df;if(u.k==='dao'&&fac(u.o)===0&&u.still>=2)m*=0.6;if(t.sp==='fort')m*=0.75;return m;}
function nearOwn(o,q,r,R){for(const t of ring(q,r,R))if(t.own===o)return true;return false;}
function doHit(u,tg){const U=UT[u.k];let dmg=U.atk*atkMul(u,tg)*defMul(tg)*(0.9+rnd()*0.2);if(u.k==='qi')u.run=0;
  applyDmg(tg,dmg,u.o);
  if((U.fly||u.k==='nu')&&fac(u.o)===2&&tg.type==='u'||(u.k==='bird'&&tg.type==='u')){tg.o.burn=3;tg.o.burnBy=u.o;}
  if(U.splash){for(const n of nbrs(tg.q,tg.r)){const v=unitAt(n.q,n.r);if(v&&enemy(u.o,v.o)&&v!==tg.o)applyDmg({type:'u',o:v,owner:v.o,q:v.q,r:v.r},dmg*0.4,u.o);}}
  if(!HEADLESS&&(G.vis.has(key(u.q,u.r))||G.vis.has(key(tg.q,tg.r)))){fxPush({k:U.rng>1?(U.siege?'stone':'arrow'):'slash',q0:u.q,r0:u.r,q:tg.q,r:tg.r,t:0,d:U.rng>1?0.45:0.25,fire:fac(u.o)===2||u.k==='bird'});if(U.rng>1)SFX.arrow();else SFX.hit();}}
function applyDmg(tg,dmg,by){const o=tg.o;o.hp-=dmg;if(tg.type==='u'){o.hurt=G.t;if(o.hp<=0)killUnit(o,by);}
  else{o.hurt=G.t;if(o.hp<=0){if(o.k==='cap')capFall(o,by);else{delete G.blds[o.id];if(!HEADLESS)fxPush({k:'die',q:o.q,r:o.r,t:0,d:1,col:colOf(o.o)});}}}
  if(!HEADLESS&&G.vis.has(key(tg.q,tg.r))&&dmg>=1)fxPush({k:'num',q:tg.q,r:tg.r,txt:'-'+Math.round(dmg),t:0,d:0.8});}
function capFall(b,by){delete G.blds[b.id];const o=b.o;P(o).dead=true;for(const u of unitsOf(o))killUnit(u,-1);for(const t of Object.values(G.tiles))if(t.own===o)t.own=-1;
  const alive=G.pl.map((p,i)=>i).filter(i=>!P(i).dead);const teams=new Set(alive.map(i=>P(i).team));if(teams.size<=1)G.over={w:alive[0],t:G.t};
  feed(o===ME?'我们的主营被攻破了……':`${FAC[fac(o)].n}的主营被我们攻破了！`,o===ME?'bad':'good');}
function inRange(u,tg){return hexDist(u.q,u.r,tg.q,tg.r)<=UT[u.k].rng;}
function seenBy(o,q,r){return o===ME?G.vis.has(key(q,r)):true;}
function bestTarget(u,R){let best=null,bs=-1e9;const U=UT[u.k];
  for(const t of ring(u.q,u.r,R)){const v=unitAt(t.q,t.r);if(v&&enemy(u.o,v.o)){const d=hexDist(u.q,u.r,v.q,v.r);let s=-d*3+((CTR[u.k]&&CTR[u.k][v.k])||1)*10-v.hp/40;if(U.siege&&!U.ace)s-=20;if(s>bs){bs=s;best={u:v.id};}}
    const b=bldAt(t.q,t.r);if(b&&enemy(u.o,b.o)){let s=-hexDist(u.q,u.r,b.q,b.r)*3+(U.siege?30:-8);if(s>bs){bs=s;best={b:b.id};}}}
  return best;}

/* ================= 每一步 ================= */
function stepUnit(u){const U=UT[u.k];if(u.cd>0)u.cd-=DT;
  if(u.burn>0){u.burn-=DT;u.hp-=2*DT;if(u.hp<=0){killUnit(u,u.burnBy);return;}}
  if(u.hurt&&G.t-u.hurt>5&&T(u.q,u.r).own===u.o&&u.hp<maxHP(u.o,u.k))u.hp=Math.min(maxHP(u.o,u.k),u.hp+maxHP(u.o,u.k)*0.02*DT);
  if(u.mp<1){const t=T(u.q,u.r);u.mp+=DT/(U.spd*(U.fly?1:TER[t.t].mv));if(u.mp>=1){u.mp=1;u.run++;}u.still=0;return;}
  u.still+=DT;
  let tg=tgtObj(u.tgt);if(u.tgt&&!tg){u.tgt=null;u.path=null;}
  if(tg&&inRange(u,tg)){if(u.cd<=0){u.cd=U.cd;doHit(u,tg);}u.face=tg.q>=u.q?1:-1;return;}
  // 顺手打射程里的敌人（攻击移动）
  if(!u.force||!u.path){const e=bestTarget(u,U.rng);if(e){const eo=tgtObj(e);if(u.cd<=0){u.cd=U.cd;doHit(u,eo);}u.face=eo.q>=u.q?1:-1;return;}}
  // 追击目标
  if(tg){u.rp=(u.rp||0)-DT;if(!u.path||u.rp<=0){u.path=pathNear(u,tg.q,tg.r,U.rng);u.rp=1;}}
  else if(!u.path&&u.dest){if(u.q===u.dest[0]&&u.r===u.dest[1])u.dest=null;else{u.path=pathTo(u,u.dest[0],u.dest[1]);if(!u.path)u.path=pathNear(u,u.dest[0],u.dest[1],1);if(!u.path)u.dest=null;}}
  else if(!u.path&&!u.dest){// 待命：附近有敌人就迎上去（不追太远）
    if(!u.home)u.home=[u.q,u.r];u.ag=(u.ag||0)-DT;if(u.ag<=0){u.ag=0.6;const e=bestTarget(u,4);if(e){const eo=tgtObj(e);if(eo&&seenBy(u.o,eo.q,eo.r)&&hexDist(eo.q,eo.r,u.home[0],u.home[1])<=5){u.tgt=e;u.auto=1;}}
      else if(u.auto){u.auto=0;if(u.q!==u.home[0]||u.r!==u.home[1])u.dest=[u.home[0],u.home[1]];}}}
  if(u.path&&u.path.length){const[nq,nr]=u.path[0];const t=T(nq,nr);const ou=unitAt(nq,nr);
    if(!passT(t,U.fly)||bldAt(nq,nr)){u.path=null;return;}
    if(ou){u.wait+=DT;if(u.wait>0.7){u.wait=0;if(u.dest&&u.path.length===1&&ou.o===u.o){u.path=null;u.dest=null;u.home=[u.q,u.r];return;}u.path=tg?pathNear(u,tg.q,tg.r,U.rng):u.dest?(pathTo(u,u.dest[0],u.dest[1],true)||pathNear(u,u.dest[0],u.dest[1],1)):null;}return;}
    u.wait=0;delete UAT[key(u.q,u.r)];u.pq=u.q;u.pr=u.r;u.q=nq;u.r=nr;UAT[key(nq,nr)]=u.id;u.mp=0;u.path.shift();u.face=hx(nq,nr)[0]>=hx(u.pq,u.pr)[0]?1:-1;if(!u.path.length){u.path=null;if(u.dest&&u.q===u.dest[0]&&u.r===u.dest[1]){u.dest=null;u.force=0;u.home=[u.q,u.r];}}}
  else{u.run=0;}}
function stepBld(b){if(b.cd>0)b.cd-=DT;const isCap=b.k==='cap';const rng=isCap?2:TOWER.rng;
  if(isCap&&b.hp<b.max&&!ring(b.q,b.r,3).some(t=>{const v=unitAt(t.q,t.r);return v&&enemy(b.o,v.o);}))b.hp=Math.min(b.max,b.hp+3*DT);
  if(b.cd>0)return;let best=null,bh=1e9;for(const t of ring(b.q,b.r,rng)){const v=unitAt(t.q,t.r);if(v&&enemy(b.o,v.o)&&v.hp<bh){bh=v.hp;best=v;}}
  if(best){let decay=isCap&&G.t>1200?Math.max(0.4,1-(G.t-1200)/600):1;b.cd=isCap?1.2:TOWER.cd;const dmg=(isCap?16:TOWER.atk)*decay*defMul({type:'u',o:best});applyDmg({type:'u',o:best,owner:best.o,q:best.q,r:best.r},dmg,b.o);
    if(!HEADLESS&&(G.vis.has(key(b.q,b.r))||G.vis.has(key(best.q,best.r))))fxPush({k:'arrow',q0:b.q,r0:b.r,q:best.q,r:best.r,t:0,d:0.4});}}
function stepProd(o){const p=P(o);if(p.dead||!p.q.length)return;const k=p.q[0];p.qp+=DT;if(p.qp<UT[k].tt)return;
  const cap=Object.values(G.blds).find(b=>b.k==='cap'&&b.o===o);if(!cap)return;
  const spots=ring(cap.q,cap.r,2).filter(t=>passT(t,UT[k].fly)&&!unitAt(t.q,t.r)&&!bldAt(t.q,t.r)).sort((a,b)=>hexDist(a.q,a.r,cap.q,cap.r)-hexDist(b.q,b.r,cap.q,cap.r)||hexDist(a.q,a.r,0,0)-hexDist(b.q,b.r,0,0));
  if(!spots.length)return;p.q.shift();p.qp=0;const u=addUnit(o,k,spots[0].q,spots[0].r);p.stats.made++;
  if(p.rally){u.dest=p.rally.slice();u.force=0;}
  if(o===ME){SFX.ready();if(UT[k].ace)feed(`王牌「${UT[k].n}」出阵！`,'good');}}
function calcInc(){const land=G.pl.map((p,o)=>Object.values(G.tiles).filter(t=>t.own===o).length);
  G.pl.forEach((p,o)=>{if(p.dead){p.inc=0;return;}let inc=2+land[o]*0.07;for(const t of Object.values(G.tiles))if(t.own===o&&t.sp)inc+=SP[t.sp].inc;
    const mx=Math.max(...land.filter((_,i)=>i!==o&&enemy(o,i)));p.catch=land[o]<mx*0.5?1.4:land[o]<mx*0.75?1.2:1;inc*=p.catch;if(p.route.includes('zong'))inc*=1.25;
    if(p.ai)inc*=[0.8,1,1.2][G.diff];p.inc=inc;p.land=land[o];});}
function stepCapture(){for(const u of Object.values(G.units)){if(u.mp<1)continue;const t=T(u.q,u.r);if(t.own===u.o||bldAt(t.q,t.r))continue;
    if(!nbrs(t.q,t.r).some(n=>n.own===u.o)&&!(t.own<0&&nbrs(t.q,t.r).some(n=>{const v=unitAt(n.q,n.r);return v&&v.o===u.o&&T(n.q,n.r).own===u.o;})))continue;
    if(ring(t.q,t.r,1).some(n=>{const v=unitAt(n.q,n.r);return v&&enemy(u.o,v.o);}))continue;
    if(!t.cap||t.cap.o!==u.o)t.cap={o:u.o,p:0};t.cap.p+=0.5;const need=t.sp?SP[t.sp].need:t.own<0?1.5:3;
    if(t.cap.p>=need){const was=t.own;t.own=u.o;t.cap=null;t.disc=0;if(t.sp&&!HEADLESS){if(u.o===ME){feed(`占领了${SP[t.sp].n}：${SP[t.sp].d}`,'good');SFX.cap();}else if(was===ME)feed(`我们的${SP[t.sp].n}被抢走了！`,'bad');}}}
  for(const t of Object.values(G.tiles))if(t.cap&&!(unitAt(t.q,t.r)&&unitAt(t.q,t.r).o===t.cap.o))t.cap=null;}
function stepConnect(){G.pl.forEach((p,o)=>{if(p.dead)return;const cap=Object.values(G.blds).find(b=>b.k==='cap'&&b.o===o);if(!cap)return;const seen=new Set([key(cap.q,cap.r)]);const st=[T(cap.q,cap.r)];
  while(st.length){const t=st.pop();for(const n of nbrs(t.q,t.r)){const k=key(n.q,n.r);if(n.own===o&&!seen.has(k)){seen.add(k);st.push(n);}}}
  for(const t of Object.values(G.tiles)){if(t.own!==o)continue;if(seen.has(key(t.q,t.r)))t.disc=0;else{t.disc=(t.disc||0)+2;if(t.disc>=6){t.own=-1;t.disc=0;}}}});}
function updVis(){const v=new Set();const add=(q,r,R)=>{for(const t of ring(q,r,R))v.add(key(t.q,t.r));};
  for(const u of Object.values(G.units))if(u.o===ME||!enemy(ME,u.o))add(u.q,u.r,UT[u.k].fly?4:3);
  for(const b of Object.values(G.blds))if(b.o===ME||!enemy(ME,b.o))add(b.q,b.r,b.k==='cap'?4:3);
  for(const t of Object.values(G.tiles))if(t.own===ME||(t.own>=0&&!enemy(ME,t.own)))add(t.q,t.r,t.sp?SP[t.sp].vis:1);
  if(G.over)for(const k in G.tiles)v.add(k);
  G.vis=v;for(const k of v)G.exp.add(k);}
let accInc=0,accCap=0,accCon=0,accVis=0,accAI=0;
function tick(){if(G.over)return;G.t+=DT;
  for(const p of G.pl)if(!p.dead)p.mil+=p.inc*DT;
  G.pl.forEach((p,o)=>stepProd(o));
  const us=Object.values(G.units);for(const u of us)if(G.units[u.id])stepUnit(u);
  for(const b of Object.values(G.blds))if(G.blds[b.id])stepBld(b);
  accCap+=DT;if(accCap>=0.5){accCap=0;stepCapture();}
  accCon+=DT;if(accCon>=2){accCon=0;stepConnect();}
  accInc+=DT;if(accInc>=1){accInc=0;calcInc();}
  accVis+=DT;if(accVis>=0.3&&!HEADLESS){accVis=0;updVis();}
  accAI+=DT;if(accAI>=1){accAI=0;G.pl.forEach((p,o)=>{if(p.ai&&!p.dead)aiTick(o);});}
  if(!HEADLESS&&Math.floor(G.t)===1200&&Math.floor(G.t-DT)===1199)feed('二十分钟过去了：各家的城墙开始衰退，主营越来越难守！','bad');}

/* ================= 指令（玩家和电脑都用这一套，之后联机也走这里） ================= */
function cmd(c){const o=c.o;const p=P(o);if(!p||p.dead||G.over)return false;
  switch(c.t){
   case 'train':{const k=c.k;if(!UT[k]||!canTrain(o,k))return false;const cost=costOf(o,k);if(p.mil<cost||popOf(o)>=POPCAP[p.era]+(UT[k].ace?1:0))return false;if(p.q.length>=5)return false;p.mil-=cost;p.q.push(k);return true;}
   case 'cancel':{const i=c.i;if(i<0||i>=p.q.length)return false;const k=p.q.splice(i,1)[0];p.mil+=costOf(o,k);if(i===0)p.qp=0;return true;}
   case 'era':{if(p.era>=3)return false;const E=ERA[p.era+1];if(p.mil<E.cost)return false;const op=E.ops.find(x=>x.k===c.k);if(!op)return false;p.mil-=E.cost;p.era++;p.route.push(op.k);
     if(op.k==='mo'){const cap=Object.values(G.blds).find(b=>b.k==='cap'&&b.o===o);if(cap){cap.max=Math.round(cap.max*1.3);cap.hp=Math.round(cap.hp*1.3);}}
     if(op.k==='jiang')for(const u of unitsOf(o))u.hp*=1.15;
     if(!HEADLESS){if(o===ME){feed(`进入第${'一二三'[p.era-1]}时代：选择了「${op.n}」——${op.d}`,'good');SFX.era();}else if(G.vis.size)feed(`${FAC[fac(o)].n}进入了第${'一二三'[p.era-1]}时代（${op.n}）。`);}return true;}
   case 'move':{const ids=c.ids.filter(i=>G.units[i]&&G.units[i].o===o);if(!ids.length)return false;const dests=formation(ids.map(i=>G.units[i]),c.q,c.r);
     ids.forEach((id,i)=>{const u=G.units[id];u.tgt=null;u.auto=0;u.dest=dests[i]||[c.q,c.r];u.path=null;u.force=c.force?1:0;u.home=null;});return true;}
   case 'atk':{const ids=c.ids.filter(i=>G.units[i]&&G.units[i].o===o);const tg=c.u?{u:c.u}:{b:c.b};const to=tgtObj(tg);if(!to||!enemy(o,to.owner))return false;
     ids.forEach(id=>{const u=G.units[id];u.tgt=tg;u.auto=0;u.dest=null;u.path=null;u.home=null;});return true;}
   case 'tower':{if(!(fac(o)===3||p.route.includes('mo')))return false;const t=T(c.q,c.r);if(!t||t.own!==o||!passT(t)||bldAt(c.q,c.r)||unitAt(c.q,c.r)||p.mil<TOWER.cost)return false;
     if(Object.values(G.blds).some(b=>b.k==='tower'&&hexDist(b.q,b.r,c.q,c.r)<2))return false;p.mil-=TOWER.cost;const b={id:G.bid++,k:'tower',o,q:c.q,r:c.r,hp:TOWER.hp,max:TOWER.hp,cd:0};G.blds[b.id]=b;if(o===ME&&!HEADLESS)SFX.build();return true;}
   case 'rally':{p.rally=c.q===undefined?null:[c.q,c.r];return true;}
  }return false;}
function formation(us,q,r){const out=[];const taken=new Set();const cand=[];const seen=new Set([key(q,r)]);const st=[[q,r]];
  while(st.length&&cand.length<us.length*3+6){const[a,b]=st.shift();const t=T(a,b);if(t&&passT(t,true)){const ok=passT(t)&&!bldAt(a,b)&&!(unitAt(a,b)&&!us.includes(unitAt(a,b)));if(ok)cand.push([a,b]);}
    for(const[x,y] of DIRS){const k=key(a+x,b+y);if(!seen.has(k)&&T(a+x,b+y)&&hexDist(a+x,b+y,q,r)<=4){seen.add(k);st.push([a+x,b+y]);}}}
  // 远程兵站后排：近战先挑离目标近的格子
  const order=us.map((u,i)=>({u,i,pr:UT[u.k].rng>1?1:0})).sort((a,b)=>a.pr-b.pr);

cv.addEventListener('contextmenu',e=>{e.preventDefault();if(!G||!sel.length)return;const[q,r]=s2hex(e.clientX,e.clientY);orderTo(q,r);});
let lastTap={id:0,t:0};
function pickUnit(sx,sy){let best=null,bd=1e9;for(const u of Object.values(G.units)){if(enemy(ME,u.o)&&!G.vis.has(key(u.q,u.r)))continue;const m=u.mp<1?u.mp:1;const[x0,y0]=w2s(u.pq,u.pr),[x1,y1]=w2s(u.q,u.r);const x=x0+(x1-x0)*m,y=y0+(y1-y0)*m-cam.z*0.35;const d=Math.hypot(sx-x,(sy-y)*1.2);if(d<cam.z*0.55&&d<bd){bd=d;best=u;}}return best;}
function tap(sx,sy){if(!G||G.over)return;const u=pickUnit(sx,sy);const[q,r]=s2hex(sx,sy);const t=T(q,r);
  if(mode==='tower'){if(t&&cmd({t:'tower',o:ME,q,r})){mode=null;tip('弩塔修好了');}else tip('这里修不了：要自己的空地，而且离别的弩塔至少 2 格');drawProd();return;}
  if(u&&u.o===ME){const now=performance.now();if(lastTap.id===u.id&&now-lastTap.t<380){sel=unitsOf(ME).filter(v=>v.k===u.k).map(v=>v.id);tip(`选中了所有「${UT[u.k].n}」`);}
    else if(multi){sel=sel.includes(u.id)?sel.filter(i=>i!==u.id):sel.concat(u.id);}else sel=[u.id];lastTap={id:u.id,t:now};SFX.click();updSel();coachDid('sel');return;}
  if(u&&enemy(ME,u.o)){if(sel.length){cmd({t:'atk',o:ME,ids:sel,u:u.id});fxPush({k:'tap',q:u.q,r:u.r,t:0,d:0.5,col:'#e0473a'});SFX.click();coachDid('atk');}else tip(`敌方「${UT[u.k].n}」：${UT[u.k].d}`);return;}
  const b=t&&bldAt(q,r);if(b&&enemy(ME,b.o)&&G.exp.has(key(q,r))){if(sel.length){cmd({t:'atk',o:ME,ids:sel,b:b.id});fxPush({k:'tap',q,r,t:0,d:0.5,col:'#e0473a'});SFX.click();coachDid('atk');}else tip(b.k==='cap'?'敌方主营：打破它就赢了！选中部队再点它。攻城车拆城最快。':'敌方弩塔');return;}
  if(!t)return;
  if(sel.length){orderTo(q,r);return;}
  if(t.sp)tip(`${SP[t.sp].n}：${SP[t.sp].d}。派兵站上去就能占领。`);else if(b&&b.k==='cap')tip('我们的主营：被打破就输了。下面的按钮造兵、升时代。');else tip(`${TER[t.t].n}${TER[t.t].mv>1?'：走得慢，站在上面受到伤害 −20%':TER[t.t].mv===0?'：过不去':''}`);}
function orderTo(q,r){const t=T(q,r);if(!t)return;if(!passT(t)&&!sel.some(i=>G.units[i]&&UT[G.units[i].k].fly)){tip('那里过不去');return;}cmd({t:'move',o:ME,ids:sel,q,r});fxPush({k:'tap',q,r,t:0,d:0.5});SFX.click();coachDid('move');}

/* ================= 教学 ================= */
function tutPref(){try{return localStorage.getItem('pc-tut')!=='0';}catch(e){return true;}}
function tutSet(v){try{localStorage.setItem('pc-tut',v?'1':'0');}catch(e){}$('#tutOn').checked=v;}
let TUT={i:0,off:false,did:{}};
function tutCards(){const F=FAC[fac(ME)];return [
  `<h3>目标：破城</h3><ul><li>地图两端各有一座<b>主营</b>，<b>打破敌人的主营就赢</b>，自己的被打破就输。</li><li><b>军需</b>是唯一的资源：占的地越多、收入越高。地盘比对手少很多时，会有<b>落后加成</b>。</li><li>中间的<b>中央核心</b>、两侧的<b>铁矿</b>和<b>关隘</b>是必争之地，派兵站上去就能占领。</li><li>20 分钟后城墙开始衰退，主营越来越难守。</li></ul>`,
  `<h3>怎么操作</h3><ol><li><b>点自己的兵</b>选中；<b>再点地面</b>移动，<b>点敌人</b>进攻。</li><li>「<b>全军</b>」一次选中所有兵；「<b>多选</b>」打开后可以一个一个加；连点两下同一个兵＝选中同兵种。</li><li>下面的按钮造兵、<b>升时代</b>（每次二选一路线）。</li><li>兵站在别人的地上一会儿，就会把地抢过来；地必须连着主营，被切断会慢慢丢掉。</li></ol><div class="tnote">拖动地图移动视角，双指 / 滚轮缩放。右上 ⏸ 可以暂停。</div>`,
  `<h3>兵种克制</h3><p style="text-align:center;font-size:18px;font-weight:900;margin:6px 0">刀盾 → 骑兵 → 弓弩 → 刀盾</p><p style="text-align:center;font-size:12px;color:var(--sub);margin:0 0 6px">（箭头指向被克制的一方）</p><ul><li><b>攻城车</b>（第二时代）：拆城 ×3，但打人弱、怕骑兵。</li><li><b>王牌</b>（第三时代，限 1 个）：非常强，但怕成群的弓弩。</li><li>树林、丘陵、关隘上的兵更耐打；离自己的地太远会断补给，攻击 −20%。</li></ul>`,
  `<p style="text-align:center;font-size:44px;font-weight:900;margin:0;color:${F.col}">${F.n}</p><h3>你的招牌</h3><p>${F.trait}</p><div class="tnote">打法：${F.tip}</div><p style="font-size:13px">王牌：<b>${UT[F.ace].n}</b>——${UT[F.ace].d}</p>`];}
function tutStart(){TUT={i:0,off:!tutPref(),did:{},shown:{}};if(TUT.off){paused=false;return;}paused=true;tutCard();}
function tutCard(){const cs=tutCards();const i=TUT.i;$('#tutC').innerHTML=`<div class="tdots">${cs.map((_,j)=>`<i style="${j===i?'background:'+FAC[fac(ME)].col:''}"></i>`).join('')}</div>${cs[i]}<label class="tchk"><input type="checkbox" id="tNo" ${tutPref()?'':'checked'}> 以后开局不再显示（主菜单可以重新打开）</label><div class="acts2">${i?'<button class="b" id="tPrev">上一张</button>':'<button class="b" id="tSkip">跳过教学</button>'}<button class="b main" id="tNext">${i<cs.length-1?'下一张':'开战！'}</button></div>`;
  $('#ovTut').hidden=false;$('#tNo').onchange=e=>tutSet(!e.target.checked);
  const close=coach=>{$('#ovTut').hidden=true;paused=false;if(!coach)TUT.off=true;};
  if($('#tPrev'))$('#tPrev').onclick=()=>{TUT.i--;tutCard();};if($('#tSkip'))$('#tSkip').onclick=()=>close(false);
  $('#tNext').onclick=()=>{if(TUT.i<cs.length-1){TUT.i++;tutCard();}else close(tutPref());};}
const COACH=[{id:'sel',txt:'先点一个自己的兵（头上有「刀」「弩」「骑」字的小人），把它选中。'},{id:'move',txt:'再点地图上的一格，它就会走过去。试着派兵去占旁边的空地。'},{id:'train',txt:'点下面的「刀盾 / 弓弩 / 骑兵」按钮造兵。军需会自己慢慢涨。',done:()=>P(ME).stats.made>0||P(ME).q.length>0},{id:'sp',txt:'派兵去占中间的「中央核心」或两侧的「铁矿」，收入会大涨。',done:()=>Object.values(G.tiles).some(t=>t.sp&&t.own===ME)},{id:'era',txt:'军需够了就点「升时代」，二选一路线。第二时代能造攻城车，第三时代能出王牌。',done:()=>P(ME).era>1,av:()=>P(ME).mil>=ERA[2].cost},{id:'atk',txt:'准备好了就点「全军」，再点敌人的主营——打破它就赢！',av:()=>G.t>240}];
function coachDid(k){if(TUT)TUT.did[k]=1;}
function coachTick(){const el=$('#coach');if(!G||TUT.off||G.over||!$('#ovTut').hidden){el.hidden=true;return;}let st=null;for(const c of COACH){if(TUT.shown[c.id]==='x')continue;if(TUT.did[c.id]||c.done&&c.done()){TUT.shown[c.id]='x';continue;}if(!c.av||c.av()){st=c;break;}}
  if(!st){el.hidden=true;return;}if(el._id!==st.id){el._id=st.id;el.innerHTML=`<div style="font-size:11px;font-weight:700;color:var(--ac)">新手提示</div>${st.txt}<div class="cb"><button id="cOff">关掉提示</button><button class="k" id="cOk">知道了</button></div>`;$('#cOk').onclick=()=>{TUT.shown[st.id]='x';el._id=null;};$('#cOff').onclick=()=>{TUT.off=true;};}el.hidden=false;}

/* ================= 菜单 / 结束 ================= */
let myF=0,diff=1;try{myF=+(localStorage.getItem('pc-fac')||0)||0;}catch(e){}
function drawFacs(){$('#facPick').innerHTML=FAC.map((f,i)=>`<div class="fc ${i===myF?'on':''}" data-f="${i}"><div class="big" style="color:${f.col}">${f.n}</div><div class="s">${f.py}</div></div>`).join('');const f=FAC[myF];$('#facInfo').innerHTML=`<b style="color:${f.col}">${f.n}</b>：${f.lore}<br>${f.trait}<br>王牌：${UT[f.ace].n}`;
  $('#facPick').querySelectorAll('.fc').forEach(el=>el.onclick=()=>{myF=+el.dataset.f;try{localStorage.setItem('pc-fac',myF);}catch(e){}drawFacs();});}
drawFacs();$('#tutOn').checked=tutPref();$('#tutOn').onchange=e=>tutSet(e.target.checked);
$('#diffSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;diff=+b.dataset.d;$('#diffSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));};
$('#bStart').onclick=()=>{au();const others=[0,1,2,3].filter(i=>i!==myF);const foe=others[Math.floor(Math.random()*others.length)];newGame({facs:[myF,foe],me:0,diff});sel=[];mode=null;$('#ovMenu').hidden=true;$('#ovEnd').hidden=true;
  const c=Object.values(G.blds).find(b=>b.k==='cap'&&b.o===ME);centerOn(c.q,c.r+2);cam.z=innerWidth<600?40:50;spriteCache.clear();feed(`对手是「${FAC[foe].n}」：${FAC[foe].trait}`);tutStart();updHUD();};
function showEnd(){const w=G.over.w===ME;const p=P(ME);$('#endC').innerHTML=`<p style="font-size:52px;font-weight:900;margin:0;color:${w?'var(--good)':'var(--bad)'}">${w?'破城！':'城破了'}</p><p>${w?'敌人的主营被我们打破了。':'我们的主营被打破了。'} 用时 ${Math.floor(G.over.t/60)} 分 ${Math.floor(G.over.t%60)} 秒</p><p style="font-size:13px;color:var(--sub)">训练 ${p.stats.made} · 击杀 ${p.stats.kill} · 损失 ${p.stats.lost}</p><div class="acts2"><button class="b main" id="eAgain">再来一局</button></div>`;
  $('#ovEnd').hidden=false;$('#eAgain').onclick=()=>{$('#ovEnd').hidden=true;$('#ovMenu').hidden=false;};(w?SFX.win:SFX.lose)();}

/* ================= 主循环 ================= */
let last=performance.now(),acc=0,hudT=0,overShown=false;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(0.1,(now-last)/1000);last=now;gt+=dt;
  try{if(G&&!G.over&&!paused){acc+=dt;let n=0;while(acc>=DT&&n++<5){tick();acc-=DT;}}
    if(G&&G.over&&!overShown){overShown=true;updVis();setTimeout(showEnd,900);}if(G&&!G.over)overShown=false;
    render();hudT+=dt;if(G&&hudT>0.25){hudT=0;updHUD();coachTick();}}catch(e){console.error(e);}}
requestAnimationFrame(loop);
// 测试用：电脑对电脑快速模拟
function simGame(seed,fa,fb,maxT){HEADLESS=true;newGame({seed,facs:[fa,fb],me:-1,diff:1});G.pl.forEach(p=>p.ai=true);ME=0;while(!G.over&&G.t<(maxT||2400))tick();HEADLESS=false;return{w:G.over?G.over.w:-1,t:Math.round(G.t),land:G.pl.map(p=>p.land),made:G.pl.map(p=>p.stats.made),era:G.pl.map(p=>p.era)};}
</script></body></html>
